<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column; the figure is "paper" (fixed light colors, exportable), the two panes below follow the theme. */
:root {
  --bg: #f1f4f8; --fg: #1b2330; --muted: #5c687a; --panel: #ffffff; --panel2: #e9edf3; --line: #cfd7e2;
  --accent: #1d4f91; --segOff: #7383a0; --cursor: #c2185b; --vecM: #d62828; --vecC: #1d5fd1; --sphere: #8b5cf6; --equator: #7c3aed;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --fg: #e5eaf1; --muted: #9aa6b8; --panel: #171e28; --panel2: #202a37; --line: #2d3947;
  --accent: #3f74c4; --segOff: #4b5a70; --cursor: #ff5c9a; --vecM: #ff5a5a; --vecC: #6b9bff; --sphere: #a78bfa; --equator: #b79cff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141b; --fg: #e5eaf1; --muted: #9aa6b8; --panel: #171e28; --panel2: #202a37; --line: #2d3947;
  --accent: #3f74c4; --segOff: #4b5a70; --cursor: #ff5c9a; --vecM: #ff5a5a; --vecC: #6b9bff; --sphere: #a78bfa; --equator: #b79cff; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 32px; }
* { box-sizing: border-box; }
h1 { font-size: 1.45rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 small { font-weight: 400; color: var(--muted); font-size: 0.95rem; }
.h1sel { font: inherit; font-size: 1.45rem; font-weight: 700; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.h1sel:hover { border-color: var(--accent); }
#seqParams { display: contents; }
.controls .err { color: #c62828; font-family: var(--mono); font-size: 0.85rem; }
.legend canvas { width: 160px; height: 160px; flex: 0 0 160px; }
input[type=file] { display: none; }
h1 .ver { font-family: var(--mono); font-weight: 500; font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
h2 { font-size: 0.92rem; font-weight: 600; margin: 0 0 6px; }
p { margin: 0; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; max-width: 1450px; margin: 0 auto 12px; }
.lead { color: var(--muted); max-width: 70ch; }
main { max-width: 1450px; margin: 0 auto; display: grid; gap: 14px; }
.figure { background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; padding: 6px 4px; }
.figure svg { display: block; width: 100%; height: auto; min-width: 980px; cursor: crosshair; touch-action: none; }
.figure svg .trh { font-weight: 400; }
.figure svg .trh.on { font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.controls .grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.controls label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--fg); }
.controls label .v { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 5.2ch; text-align: right; color: var(--accent); }
button { font: inherit; font-weight: 500; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #fff; border-color: transparent; min-width: 6.5em; }
input[type=range] { width: 110px; accent-color: var(--accent); }
select { font: inherit; font-size: 1rem; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
option { font: inherit; font-size: 1rem; font-weight: 400; color: var(--fg); background: var(--panel2); padding: 4px 6px; }   /* the drop-down list does not inherit the select's font reliably */
.h1sel option { font-size: 1.05rem; font-weight: 500; }
/* custom drop-downs: the native list is rendered by the OS and may ignore page fonts and DPI; the select stays in the
   DOM (state, change events) and a button + in-page list replace its popup */
.dd { position: relative; display: inline-block; }
.dd > select { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.ddbtn { font: inherit; font-size: 1.05rem; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 28px 4px 8px; cursor: pointer; text-align: left; white-space: nowrap; position: relative; }
.ddbtn::after { content: ""; position: absolute; right: 10px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.ddbtn:hover { border-color: var(--accent); }
.dd.h1 .ddbtn { font-size: 1.45rem; font-weight: 700; background: var(--panel); border-radius: 6px; padding: 2px 34px 2px 10px; }
.ddlist { position: absolute; top: calc(100% + 3px); left: 0; z-index: 60; min-width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); padding: 4px; display: none; max-height: 60vh; overflow: auto; font-size: 1.1rem; font-weight: 400; line-height: 1.35; }
.ddlist.open { display: block; }
.ddlist [role=option] { padding: 7px 14px; white-space: nowrap; cursor: pointer; border-radius: 4px; color: var(--fg); }
.ddlist [role=option]:hover, .ddlist [role=option].cur { background: var(--accent); color: #fff; }
.status { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); padding: 0 4px; line-height: 1.4; font-variant-numeric: tabular-nums; }
#status { height: 2.8em; overflow: hidden; }   /* always exactly two lines: the panes below never shift */
.status b { color: var(--fg); font-weight: 500; }
.controls .fstatus { padding: 0; flex: 1 1 220px; }
.panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; min-width: 0; }
.pane h2 { line-height: 1.3; min-height: 1.3em; margin: 0 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane .foot { display: grid; gap: 8px; margin-top: 10px; }
.gainrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
[hidden] { display: none !important; }
canvas { display: block; width: 100%; max-width: 100%; }
.seg { display: inline-flex; border-radius: 6px; overflow: hidden; font-size: 0.82rem; justify-self: start; }
.seg label { padding: 4px 11px; cursor: pointer; color: #fff; background: var(--segOff); display: inline-flex; align-items: center; gap: 5px; }
.seg label.on { background: var(--accent); font-weight: 600; }
.seg label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg input { position: absolute; opacity: 0; width: 0; height: 0; }
.pane .sub { color: var(--muted); font-size: 0.8rem; }
.tissues { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tissues span { display: inline-flex; align-items: center; gap: 5px; }
.tissues i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); }
.legend { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: var(--muted); font-size: 0.8rem; }
.legend .samp { font-family: var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
summary { cursor: pointer; font-weight: 600; }
details ul { margin: 6px 0 2px; padding-left: 1.2em; max-width: 90ch; color: var(--fg); }
details li { margin: 3px 0; }
.eqs { display: grid; gap: 10px; margin: 8px 0 4px; max-width: 95ch; }
.eqs h3 { font-size: 0.9rem; margin: 0 0 3px; }
.eqs p { margin: 2px 0; line-height: 1.6; }
.eqs .m { font-family: 'IBM Plex Serif', 'Times New Roman', serif; font-style: italic; }
.eqs .m sub, .eqs .m sup { font-style: normal; font-size: 0.72em; }
.eqs .r { font-style: normal; }
kbd { font-family: var(--mono); font-size: 0.8em; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <h1 id="h1"><select id="seqSel" class="h1sel"></select> <small id="sub"></small> <span class="ver">v1</span></h1>
  <p class="lead" id="lead"></p>
</header>
<main>
  <section class="figure"><div id="figwrap"></div></section>
  <section class="controls">
    <div class="grp">
      <button class="primary" id="play"></button>
      <button id="reset"></button>
      <button id="prev" title="←"></button>
      <button id="next" title="→"></button>
    </div>
    <div class="grp">
      <label><span id="lSpeed"></span> <input type="range" id="speed" min="2" max="120" step="1" value="10"><span class="v" id="vSpeed"></span></label>
    </div>
    <div class="grp">
      <span id="seqParams"></span>
      <label><input type="checkbox" id="relaxOverride"> <span id="lRelaxOverride"></span></label>
      <label>T1 <input type="range" id="T1" min="10" max="1010" step="10" value="80"><span class="v" id="vT1"></span></label>
      <label>T2 <input type="range" id="T2" min="5" max="505" step="5" value="60"><span class="v" id="vT2"></span></label>
    </div>
    <div class="grp">
      <label><span id="lPhantom"></span> <select id="phantom"><option value="squareAir" selected></option><option value="letterFAir"></option><option value="uniform"></option><option value="square"></option><option value="letterF"></option><option value="ramp"></option><option value="brain"></option></select></label>
      <label>N <select id="nsel"><option>3</option><option selected>5</option><option>7</option><option>9</option><option>11</option><option>13</option><option>15</option></select></label>
      <label><input type="checkbox" id="linear"> <span id="lLinear"></span></label>
      <label><input type="checkbox" id="compress" checked> <span id="lCompress"></span></label>
      <button id="copysvg"></button>
      <button id="loadseq"></button><input type="file" id="seqfile" accept=".json,application/json">
      <button id="copyseq"></button>
      <button id="lang">EN</button>
    </div>
    <div class="err" id="err"></div>
    <div class="grp" hidden>
    </div>
  </section>
  <div class="status" id="status"></div>
  <section class="panes">
    <div class="pane">
      <h2 id="tSpins"></h2>
      <canvas id="spins"></canvas>
      <div class="foot">
        <div class="seg" role="radiogroup"><label id="labDensity" class="on"><input type="radio" name="cellmode" id="modeDensity" value="density" checked><span id="lModeDensity"></span></label><label id="labPhase"><input type="radio" name="cellmode" id="modePhase" value="phase"><span id="lModePhase"></span></label><label id="labTissue"><input type="radio" name="cellmode" id="modeTissue" value="tissue"><span id="lModeTissue"></span></label></div>
        <div class="tissues" id="tissueLegend"></div>
        <div class="sub" id="sSpins"></div>
      </div>
    </div>
    <div class="pane">
      <h2 id="tK"></h2>
      <canvas id="kspace"></canvas>
      <div class="foot">
        <div class="legend"><canvas id="wheel"></canvas><div class="samp" id="lastSample"></div></div>
      </div>
    </div>
  </section>
  <section class="controls">
    <div class="grp">
      <button class="primary" id="fplay"></button>
      <button id="freset"></button>
      <button id="fprev"></button>
      <button id="fnext"></button>
    </div>
    <div class="grp">
      <label><span id="lFspeed"></span> <input type="range" id="fspeed" min="1" max="200" step="1" value="10"><span class="v" id="vFspeed"></span></label>
    </div>
    <div class="status fstatus" id="fstatus"></div>
  </section>
  <section class="panes">
    <div class="pane">
      <h2 id="tImg"></h2>
      <canvas id="img"></canvas>
      <div class="foot"><div class="sub" id="sImg"></div></div>
    </div>
    <div class="pane">
      <h2 id="tMode"></h2>
      <canvas id="mode"></canvas>
      <div class="foot">
        <div class="gainrow" id="gainRow" hidden><span class="sub" id="lGain"></span>
          <div class="seg" role="radiogroup" id="gainSeg"><label class="on"><input type="radio" name="rgain" value="1" checked><span>×1</span></label><label><input type="radio" name="rgain" value="10"><span>×10</span></label><label><input type="radio" name="rgain" value="100"><span>×100</span></label><label><input type="radio" name="rgain" value="1000"><span>×1000</span></label></div>
        </div>
        <div class="sub" id="sMode"></div>
      </div>
    </div>
  </section>
  <details><summary id="tNotes"></summary><ul id="notes"></ul></details>
  <details><summary id="tEq"></summary><div id="eqs" class="eqs"></div></details>
</main>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const I18N = {
  pt: {
    play: '▶ Aquisição', pause: '❚❚ Pausar', reset: '⟲ Início', prev: '◀ evento', next: 'evento ▶', speed: 'velocidade',
    phantom: 'objeto', squareAir: 'quadrado (cheio/vazio)', letterFAir: 'letra F (cheio/vazio)', uniform: 'uniforme (SC)', square: 'quadrado (SC sobre SB)', letterF: 'letra F (SC sobre SB)', ramp: 'rampa de M₀ (SC)', brain: 'cérebro', uniformDesc: '', 
    modeDensity: 'intensidade', modePhase: 'intensidade + fase', modeTissue: 'tecido', relaxOverride: 'T1/T2 globais (ignorar tecidos)', tissueHdr: 'tecido: PD · T1 · T2 (ms, 3 T)', linear: 'intensidade linear (sem √)', compress: 'comprimir TR', loadseq: 'carregar sequência (.json)', copyseq: 'copiar JSON da sequência', lang: 'EN', copy: 'copiar SVG do diagrama', copied: 'copiado ✓', copyFail: 'falhou — selecione e copie',
    tSpins: n => `Matriz ${n}×${n} de pixels (referencial girante)`, sSpinsDensity: 'escala de cinza = densidade de prótons M₀ · vermelho: M · azul: M∥ (z) e M⊥ (xy)', sSpinsTissue: 'cor = tecido (T1, T2 e M₀ próprios) · vermelho: M · azul: M∥ (z) e M⊥ (xy)', sSpinsPhase: 'cor = fase de M⊥ · intensidade = |M⊥| · vermelho: M · azul: M∥ (z) e M⊥ (xy)',
    tK: 'Espaço k (kₓ, k_y)', peDesc: 'codificação por fase', feDesc: 'codificação por frequência', envDesc: 'e<tspan dy="-5" font-size="8">−t/T2</tspan>',
    fplay: '▶ Fourier reversa', fpause: '❚❚ Pausar', freset: '⟲ Início', fprev: '◀ modo', fnext: 'modo ▶', fspeed: 'velocidade', fspeedUnit: 'modos/s',
    tImg: 'Imagem', tMode: 'Modo', tResid: 'Resíduo',
    sImgIdle: '|Σ dos modos adicionados| (imagem em módulo, como no scanner) · branco = máximo da reconstrução completa',
    sImg: (s, n, nm, np) => `|Σ de ${s}/${nm} modos| (módulo) · ${n}/${np} amostras · branco = máximo da reconstrução completa`,
    sModeIdle: 'aguardando a Fourier reversa',
    sModeDC: (z) => `modo (0, 0): constante · × |S(0,0)| = ${z} ΣM₀ (vermelho = real positivo)`,
    sMode: (kx, ky, z, ph) => `modo (kₓ, k_y) = (${kx}, ${ky}) e (${-kx}, ${-ky}): cos[2π(kₓx + k_yy)/${st.N} + φ], padrão normalizado, φ = ${ph}° · × |S(k) + S(−k)*| = ${z} ΣM₀ (soma do par, real positiva: vermelho)`,
    lGain: 'ganho do resíduo', sResid: (rmax, g) => `resíduo = imagem/c − imagem ideal, onde a imagem ideal é |M⊥| de cada pixel no eco central (o contraste que a sequência pretende, sem o filtro do espaço k) e c um fator de escala por mínimos quadrados · mesma escala de cinza da imagem, cinza médio = 0, ganho ×${g} · máx |Δ| = ${rmax} do máximo ideal`,
    sResid0: 'resíduo = imagem/c − imagem ideal · ≈ 0 (reconstrução exata)',
    fIdle: 'pronto (usa as amostras já adquiridas)', fRun: (s, kx, ky, nm) => `modo ${s}/${nm} · (kₓ, k_y) = ±(${kx}, ${ky})`, fDone: nm => `${nm}/${nm} · reconstrução completa`,
    legend: 'cor = fase de S(kₓ,k_y) · intensidade = |S|', legendLin: 'cor = fase de S(kₓ,k_y) · intensidade = |S| (linear)',
    seg: { rest: 'repouso: M₀ ao longo de +z', free: 'evolução livre (decaimento T2, recuperação T1)', tail: 'relaxação até o fim da repetição', end: 'aquisição completa', rf: (a, ax) => `pulso de ${a}° em torno de ${ax}`, grad: ax => `gradiente em ${ax}`, adc: 'leitura' },
    status: (t, band, kx, ky, seg) => `t = <b>${t}</b> ms · ${band}k = (<b>${kx}</b>, <b>${ky}</b>) · ${seg}`,
    phase: 'fase', mag: '|S|',
    errSeq: 'sequência inválida: ', loaded: 'sequência carregada: ', copied2: 'copiado ✓',
    last: (kx, ky, mag, ph) => `último: S(${kx}, ${ky}) = ${mag} ∠ ${ph}°`,
    tEq: 'Equações: o que é calculado em cada painel',
    eqs: [
      ['Diagrama da sequência', [
        'Espaço k percorrido pelos gradientes: <span class="m">k<sub>x</sub>(t) = (γ/2π) ∫<sub>0</sub><sup>t</sup> G<sub>x</sub>(t′) dt′</span>, idem em y; em unidades de Δk = 1/FOV, a área de cada lobo é o Δk que ele move. Num pulso de refocalização ideal, <span class="m">k → −k</span> no centro do pulso.',
        'Sinal: <span class="m">S(t) = Σ<sub>p</sub> [M<sub>x,p</sub>(t) + i M<sub>y,p</sub>(t)]</span> sobre os N² pixels (parte real em azul, |S| como envoltória). As amostras são tomadas nos centros dos N intervalos de dwell da leitura, onde k<sub>x</sub> é inteiro.'
      ]],
      ['Matriz de pixels', [
        'Equações de Bloch no referencial girante, pixel p em (x<sub>p</sub>, y<sub>p</sub>), com <span class="m">M<sub>⊥</sub> = M<sub>x</sub> + i M<sub>y</sub></span>: <span class="m">dM<sub>⊥</sub>/dt = −i·2π(G<sub>x</sub>x<sub>p</sub> + G<sub>y</sub>y<sub>p</sub>)(γ/2π)·M<sub>⊥</sub> − M<sub>⊥</sub>/T2</span>, <span class="m">dM<sub>z</sub>/dt = (M<sub>0</sub> − M<sub>z</sub>)/T1</span>. Num passo em que k avança (Δk<sub>x</sub>, Δk<sub>y</sub>): <span class="m">M<sub>⊥</sub> → M<sub>⊥</sub> e<sup>−iΔφ</sup>, Δφ = 2π(Δk<sub>x</sub>x<sub>p</sub> + Δk<sub>y</sub>y<sub>p</sub>)/N</span>; relaxação: <span class="m">M<sub>⊥</sub> → M<sub>⊥</sub>e<sup>−Δt/T2</sup>, M<sub>z</sub> → M<sub>0</sub> + (M<sub>z</sub> − M<sub>0</sub>)e<sup>−Δt/T1</sup></span>.',
        'Pulsos (duros): rotação de ângulo θ em torno do eixo do pulso; 90° em y: <span class="m">(M<sub>x</sub>, M<sub>z</sub>) → (M<sub>z</sub>, −M<sub>x</sub>)</span> (+z → +x); 180° de inversão em repouso: <span class="m">M<sub>z</sub> → −M<sub>z</sub></span>, e depois <span class="m">M<sub>z</sub>(t) = M<sub>0</sub>(1 − 2e<sup>−t/T1</sup>)</span>, nulo em t = T1·ln 2; 180° em x: <span class="m">(M<sub>y</sub>, M<sub>z</sub>) → (−M<sub>y</sub>, −M<sub>z</sub>)</span>, isto é, <span class="m">M<sub>⊥</sub> → M<sub>⊥</sub><sup>*</sup></span>. O ângulo cresce linearmente ao longo da largura do pulso, sem relaxação nem gradientes nesse intervalo.',
        'Cor da célula (modo intensidade + fase): matiz = <span class="m">arg M<sub>⊥</sub></span>, intensidade = <span class="m">√(|M<sub>⊥</sub>|/M<sub>0,max</sub>)</span> (ou linear). Modo intensidade: cinza = M<sub>0</sub>.'
      ]],

// replace native select popups by in-page lists (see the .dd rules); call after options or values change
function enhanceSelects() {
  for (const sel of document.querySelectorAll('select')) {
    let dd = sel.parentElement;
    if (!dd || !dd.classList.contains('dd')) {
      dd = document.createElement('span'); dd.className = 'dd' + (sel.classList.contains('h1sel') ? ' h1' : '');
      sel.replaceWith(dd); dd.appendChild(sel); sel.tabIndex = -1;
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ddbtn'; btn.setAttribute('aria-haspopup', 'listbox');
      const list = document.createElement('div'); list.className = 'ddlist'; list.setAttribute('role', 'listbox');
      dd.append(btn, list);
      const close = () => { list.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); };
      const open = () => {
        list.innerHTML = '';
        for (const o of sel.options) {
          const it = document.createElement('div'); it.setAttribute('role', 'option'); it.textContent = o.textContent; it.dataset.v = o.value;
          if (o.value === sel.value) { it.classList.add('cur'); it.setAttribute('aria-selected', 'true'); }
          it.addEventListener('click', ev => { ev.stopPropagation(); close(); if (sel.value !== o.value) { sel.value = o.value; sel.dispatchEvent(new Event('change', { bubbles: true })); } });
          list.appendChild(it);
        }
        for (const other of document.querySelectorAll('.ddlist.open')) other.classList.remove('open');
        list.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
      };
      btn.addEventListener('click', ev => { ev.stopPropagation(); list.classList.contains('open') ? close() : open(); });
      btn.addEventListener('keydown', ev => {
        const i = sel.selectedIndex, n = sel.options.length;
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); const j = Math.min(n - 1, Math.max(0, i + (ev.key === 'ArrowDown' ? 1 : -1))); if (j !== i) { sel.selectedIndex = j; sel.dispatchEvent(new Event('change', { bubbles: true })); } if (list.classList.contains('open')) open(); }
        else if (ev.key === 'Escape') close();
      });
      document.addEventListener('click', close);
      sel.addEventListener('change', () => { btn.textContent = sel.options[sel.selectedIndex]?.textContent || ''; });
    }
    dd.querySelector('.ddbtn').textContent = sel.options[sel.selectedIndex]?.textContent || '';
  }
}

function bandAt(t) { const B = st.S.bands; for (let i = B.length - 1; i >= 0; i--) if (t >= B[i].t - 1e-9) return i; return -1; }
function segmentText(t) {
  const d = L(), sg = E.segmentAt(st.S, t);
  const descOf = e => e.desc || (e.type === 'rf' ? d.seg.rf(Math.round(e.flip), e.axis) : e.type === 'adc' ? d.seg.adc : d.seg.grad(e.axis));
  if (sg.kind === 'rf') return descOf(sg.e);
  if (sg.kind === 'adc') return [descOf(sg.e)].concat(sg.grads.filter(g => g.desc).map(descOf)).join(' · ');
  if (sg.kind === 'grad') return sg.grads.map(descOf).join(' + ');

}
/* ---------- inverse Fourier reconstruction ---------- */
const F = { step: -1, phase: 0, playing: false, raf: 0, last: 0, acc: 0, speed: 1, data: null, sim: null, nAcq: -1, gain: 1 };
function acquiredUpTo(i) { const out = []; for (const s of st.sim.samples) if (s.idx <= i) out.push(s); return out; }
function fourierPrep(i) {
  const acq = acquiredUpTo(i);
  if (F.data && F.sim === st.sim && F.nAcq === acq.length) return F.data;
  const N = st.N, Hh = (N - 1) / 2, N2 = N * N, S = new Map(); for (const s of acq) S.set(s.kx + ',' + s.ky, s);
  const get = (kx, ky) => S.get(kx + ',' + ky) || { re: 0, im: 0 };
  const reps = []; for (let kx = -Hh; kx <= Hh; kx++) for (let ky = -Hh; ky <= Hh; ky++) if (kx > 0 || (kx === 0 && ky > 0)) reps.push([kx, ky]);
  reps.sort((a, b) => (a[0] * a[0] + a[1] * a[1]) - (b[0] * b[0] + b[1] * b[1]) || Math.atan2(a[1], a[0]) - Math.atan2(b[1], b[0]));
  const modes = [{ kx: 0, ky: 0, cells: [[0, 0]], Z: { re: get(0, 0).re, im: get(0, 0).im } }];
  for (const [kx, ky] of reps) { const a = get(kx, ky), b = get(-kx, -ky); modes.push({ kx, ky, cells: [[kx, ky], [-kx, -ky]], Z: { re: a.re + b.re, im: a.im - b.im } }); }

  // intends, without the k-space weighting (T2 decay across lines, truncation) that the reconstruction adds
  const s00 = acq.find(s => s.kx === 0 && s.ky === 0), ref = new Float64Array(N2), sim = st.sim;
  if (s00) for (let p = 0; p < N2; p++) ref[p] = Math.hypot(sim.Mx[s00.idx * N2 + p], sim.My[s00.idx * N2 + p]);
  const refmax = Math.max(1e-9, ...ref);
  let num = 0, den = 0; for (let p = 0; p < N2; p++) { num += mag[p] * ref[p]; den += ref[p] * ref[p]; }

  for (let p = 0; p < N2; p++) { resid[p] = (mag[p] / c - ref[p]) / refmax; rmax = Math.max(rmax, Math.abs(resid[p])); }
  F.data = { modes, full, vmax, c, resid, rmax, refmax, nAcq: acq.length, S }; F.sim = st.sim; F.nAcq = acq.length;

function fResetIfStale(i) { const n = acquiredUpTo(i).length; if (F.sim !== st.sim || F.nAcq !== n) { fPause(); F.step = -1; F.phase = 0; F.data = null; } }
function grayGrid(cv, values, map) {    // same geometry as the pixel array: pad 22 left/bottom, 5 cells
  const N = st.N, W = cv.clientWidth || 400, pad = 22, cell = (W - pad) / N, H = Math.round(cell * N + pad), ctx = setupCanvas(cv, W, H);
  axisLabels(ctx, N, pad, cell, W, H);
  for (let p = 0; p < N * N; p++) {
    const j = p % N, l = Math.floor(p / N), g = Math.round(255 * Math.max(0, Math.min(1, map(values[p]))));
    ctx.fillStyle = `rgb(${g},${g},${g})`; ctx.beginPath(); ctx.roundRect(pad + j * cell + 1, l * cell + 1, cell - 2, cell - 2, N <= 9 ? 5 : 2); ctx.fill();

}
// "× [k-space cell]" swatch inside the bottom-left cell of the mode pane: the amplitude that multiplies the pattern,
// drawn with the same colour the cell has in the k-space pane (phase hue, |S| intensity) and the same alien-green border.
function drawAmpSwatch(geo, m) {
  // the pair sum with phases aligned, Z = S(k) + S(-k)*, is what multiplies the displayed cos(theta + phi) pattern:
  // |Z| is real and non-negative, so the swatch is always phase 0 (red); its intensity encodes |Z| on the k-space scale.
  const { ctx, pad, cell, H } = geo, left = pad, bottom = H - pad, side = cell / 3;
  const x0 = left + 0.36 * cell, y0 = bottom - 0.1 * cell - side;
  const Zmag = Math.hypot(m.Z.re, m.Z.im);
  ctx.fillStyle = Zmag > 0 ? mixColor(0, intensity(Math.min(1, Zmag / st.sim.Smax))) : cssVar('--panel2');
  ctx.fillRect(x0, y0, side, side);
  ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, side, side);
  ctx.fillStyle = '#39ff14'; ctx.font = `bold ${Math.round(side * 0.8)}px ${cssVar('--font')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('×', left + 0.2 * cell, y0 + side / 2 + 1);
}
function renderFourier(i) {
  const d = fourierPrep(i), L_ = L(), s = F.step;
  const NM = nModes(), N2 = st.N * st.N, nAdded = s < 0 ? 0 : (s >= NM ? NM : s + F.phase);
  const img = new Float64Array(N2);
  for (let j = 0; j < nAdded; j++) { const m = d.modes[j]; for (let p = 0; p < N2; p++) img[p] += m.contrib[p]; }
  grayGrid($('img'), img, v => 0.1 + 0.9 * (Math.abs(v) / d.vmax));
  $('sImg').textContent = nAdded === 0 ? L_.sImgIdle : L_.sImg(nAdded, d.nAcq, NM, N2);
  if (s >= 0 && s < NM) {
    const m = d.modes[s];
    const geo = grayGrid($('mode'), m.pattern, v => 0.5 + 0.5 * v);
    drawAmpSwatch(geo, m);
    $('tMode').textContent = L_.tMode; $('gainRow').hidden = true;
    const zRel = (Math.hypot(m.Z.re, m.Z.im) / st.sim.Smax).toFixed(3);
    $('sMode').textContent = s === 0 ? L_.sModeDC(zRel) : L_.sMode(m.kx, m.ky, zRel, Math.round(m.phase * 180 / Math.PI));
    $('fstatus').textContent = L_.fRun(s + 1, m.kx, m.ky, NM);
  } else if (s >= NM) {

    grayGrid($('mode'), d.resid, v => 0.5 + 0.9 * F.gain * v * d.refmax * d.c / d.vmax);
    $('tMode').textContent = L_.tResid; $('gainRow').hidden = false;
    $('sMode').textContent = d.rmax > 1e-6 ? L_.sResid(d.rmax.toFixed(4), F.gain) : L_.sResid0;
    $('fstatus').textContent = L_.fDone(NM);
  } else {
    grayGrid($('mode'), new Float64Array(N2), () => 0.5);
    $('tMode').textContent = L_.tMode; $('gainRow').hidden = true; $('sMode').textContent = L_.sModeIdle; $('fstatus').textContent = L_.fIdle;

}
function curIndex() { return E.indexAt(st.sim, st.L.tOf(st.u)); }
function fRenderAll() { const i = curIndex(); renderK(i); renderFourier(i); }
function fAdvanceHalf() { if (F.step < 0) { F.step = 0; F.phase = 0; } else if (F.phase === 0) F.phase = 1; else { F.step++; F.phase = 0; } }
function fPlay() { pause(); if (F.step >= nModes()) { F.step = -1; F.phase = 0; } F.playing = true; F.acc = 0.5; F.last = performance.now(); $('fplay').textContent = L().fpause; cancelAnimationFrame(F.raf); F.raf = requestAnimationFrame(fTick); }
function fPause() { F.playing = false; $('fplay').textContent = L().fplay; cancelAnimationFrame(F.raf); }
function fTick(now) {

  const dt = Math.min(0.1, (now - F.last) / 1000); F.last = now; F.acc += dt * F.speed;
  while (F.acc >= 0.5) { F.acc -= 0.5; fAdvanceHalf(); if (F.step >= nModes()) { fPause(); break; } }

function fStep(dir) {

  if (dir > 0) { if (F.step < 0) { F.step = 0; F.phase = 1; } else if (F.step >= NM) return; else if (F.phase === 0) F.phase = 1; else { F.step++; F.phase = 1; if (F.step >= NM) { F.step = NM; F.phase = 0; } } }
  else { if (F.step <= 0) { F.step = -1; F.phase = 0; } else if (F.step >= NM) { F.step = NM - 1; F.phase = 1; } else { F.step--; F.phase = 1; } }
  fRenderAll();
}

function render() {
  const t = st.L.tOf(st.u), i = E.indexAt(st.sim, t), sim = st.sim;
  const x = st.L.xOfU(st.u);
  st.cursorEl.setAttribute('transform', `translate(${x.toFixed(2)},0)`); st.revealEl.setAttribute('width', x.toFixed(2));
  if (!st.scrubbing) {                                   // keep the cursor in view when the diagram is wider than its box
    const fig = $('figwrap').parentElement, svg = $('figwrap').querySelector('svg');
    if (fig.scrollWidth > fig.clientWidth + 2) {
      const rect = svg.getBoundingClientRect(), fr = fig.getBoundingClientRect();
      const cx = rect.left - fr.left + fig.scrollLeft + x * rect.width / st.L.width;

  const bi = bandAt(t), d = L(), B = st.S.bands;
  if (bi >= 0) { st.hlEl.setAttribute('x', st.bandX(bi).toFixed(2)); st.hlEl.setAttribute('width', st.bandW(bi).toFixed(2)); st.hlEl.setAttribute('opacity', '0.8'); }
  else st.hlEl.setAttribute('opacity', '0');
  for (let q = 0; q < B.length; q++) { const el = $('trh' + q); if (el) el.classList.toggle('on', q === bi); }
  const seg = st.u >= st.L.uEnd - 1e-6 ? d.seg.end : segmentText(t);
  const bandTxt = bi >= 0 ? `<b>${mk(B[bi].label)}</b> · ` : '';
  $('status').innerHTML = d.status(t.toFixed(1), bandTxt, sim.kxM[i].toFixed(2), sim.kyM[i].toFixed(2), mk(seg));
  fResetIfStale(i);

/* ---------- wiring ---------- */
for (const id of ['T1', 'T2']) $(id).addEventListener('input', () => { pause(); rebuild(); });
$('phantom').addEventListener('change', () => applyLang());
$('compress').addEventListener('change', e => { const t = st.L.tOf(st.u); st.compress = e.target.checked; pause(); rebuild(); st.u = st.L.uOf(t); render(); });
$('seqSel').addEventListener('change', e => selectSequence(e.target.value));
$('speed').addEventListener('input', readSliders);
$('fplay').addEventListener('click', () => F.playing ? fPause() : fPlay());
$('freset').addEventListener('click', () => { fPause(); F.step = -1; F.phase = 0; fRenderAll(); });
$('fprev').addEventListener('click', () => fStep(-1)); $('fnext').addEventListener('click', () => fStep(1));
for (const inp of $('gainSeg').querySelectorAll('input')) inp.addEventListener('change', e => { if (e.target.checked) { F.gain = +e.target.value; for (const lb of $('gainSeg').querySelectorAll('label')) lb.classList.toggle('on', lb.contains(e.target)); if (st.sim) renderFourier(curIndex()); } });
$('fspeed').addEventListener('input', () => { F.speed = +$('fspeed').value / 10; $('vFspeed').textContent = F.speed.toFixed(1) + ' ' + L().fspeedUnit; });
$('phantom').addEventListener('change', e => { st.phantom = e.target.value; pause(); rebuild(); });
$('nsel').addEventListener('change', e => { st.N = +e.target.value; pause(); fPause(); F.step = -1; F.phase = 0; F.data = null; st.u = 0; applyLang(); rebuild(); });
for (const id of ['modeDensity', 'modePhase', 'modeTissue']) $(id).addEventListener('change', e => { if (e.target.checked) { st.cellMode = e.target.value; $('labDensity').classList.toggle('on', st.cellMode === 'density'); $('labPhase').classList.toggle('on', st.cellMode === 'phase'); $('labTissue').classList.toggle('on', st.cellMode === 'tissue'); applyLang(); render(); } });
$('relaxOverride').addEventListener('change', () => { pause(); rebuild(); });
$('linear').addEventListener('change', e => { st.linear = e.target.checked; applyLang(); render(); });
$('play').addEventListener('click', () => st.playing ? pause() : play());
$('reset').addEventListener('click', () => { pause(); st.u = 0; render(); });
$('prev').addEventListener('click', () => stepEvent(-1)); $('next').addEventListener('click', () => stepEvent(1));
$('lang').addEventListener('click', () => { st.lang = st.lang === 'pt' ? 'en' : 'pt'; applyLang(); rebuild(); });
function registerSequence(def) {
  if (!def || typeof def !== 'object' || !def.id || !Array.isArray(def.events)) throw new Error('not a sequence file');
  E.compile(def, E.paramDefaults(def), st.lang, st.N);        // validate with defaults
  if (!st.defs[def.id]) { const o = document.createElement('option'); o.value = def.id; $('seqSel').appendChild(o); st.order.push(def.id); }
  st.defs[def.id] = def;
}
$('loadseq').addEventListener('click', () => $('seqfile').click());
$('seqfile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try { const def = JSON.parse(rd.result); registerSequence(def); selectSequence(def.id); $('err').textContent = L().loaded + loc(def.name); } catch (ex) { $('err').textContent = L().errSeq + ex.message; } };
  rd.readAsText(file); e.target.value = '';
});
$('copyseq').addEventListener('click', () => {
  const btn = $('copyseq'), txt = JSON.stringify(st.def, null, 2);
  const done = ok => { btn.textContent = ok ? L().copied2 : L().copyFail; setTimeout(() => { btn.textContent = L().copyseq; }, 1800); };
  try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (ex) { done(false); }
});
$('copysvg').addEventListener('click', () => {
  const d = L(), svg = D.build(st.S, st.sim, drawOpts({ revealAll: true })).svg, btn = $('copysvg');
  const done = ok => { btn.textContent = ok ? d.copied : d.copyFail; setTimeout(() => { btn.textContent = L().copy; }, 1800); };
  try { navigator.clipboard.writeText(svg).then(() => done(true), () => done(false)); } catch (e) { done(false); }
});
document.addEventListener('keydown', e => {
  const tag = e.target.tagName, typ = e.target.type;
  if (tag === 'SELECT' || tag === 'BUTTON' && e.code === 'Space') return;
  if (tag === 'INPUT' && !(typ === 'checkbox' && e.code !== 'Space')) return;   // sliders/radios keep their keys; checkboxes keep Space

const ro = new ResizeObserver(() => { if (st.sim) render(); }); ro.observe($('spins')); ro.observe($('kspace')); ro.observe($('img')); ro.observe($('mode'));
const mq = window.matchMedia('(prefers-color-scheme: dark)');

new MutationObserver(() => { refreshTheme(); renderWheel(); render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

for (const def of SEQUENCES) registerSequence(def);
refreshTheme(); selectSequence('se'); renderWheel();
})();
