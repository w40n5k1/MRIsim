<script>/*__TISSUES__*/</script>
<script>
(function () {
'use strict';
const E = window.SeqEngine, $ = id => document.getElementById(id);
const NS = [3, 5, 7, 9, 11, 13, 15, 17];
const I18N = {
  pt: { title: 'Editor de fantomas', lead: 'Pinte um fantoma N×N com os tecidos do dicionário e salve-o como arquivo .json para o simulador. Botão esquerdo pinta o tecido selecionado, direito pinta ar.',
        save: 'salvar (.json)', copy: 'copiar JSON', load: 'carregar (.json)', name: 'nome', back: 'simulador ↗', fillOff: 'preencher: não', fillOn: 'preencher: sim',
        undo: 'desfazer', holes: 'tapar buracos', erode: 'erodir', grow: 'crescer', hull: 'casco convexo', core: 'núcleo convexo', open: 'abrir', close: 'fechar', smooth: 'suavizar', neg: 'negativo', clear: 'limpar',
        status: (t, n, a, N) => `${t}: ${n} pixels · ar: ${a} · N = ${N}`, loaded: 'fantoma carregado: ', bad: 'fantoma inválido: ', copied: 'copiado ✓', copyFail: 'não foi possível copiar: o JSON está na caixa abaixo',
        help: '<b>Preencher</b>: com "sim", clique esquerdo enche a região conexa de ar sob o cursor com o tecido selecionado; direito apaga (vira ar) a região conexa do tecido selecionado. ' +
              'As ferramentas agem só sobre o tecido selecionado: ganhos tomam pixels de ar, perdas viram ar. <b>Erodir</b>: pixels com menos de três vizinhos ortogonais do mesmo tecido. <b>Crescer</b>: ar com dois ou mais vizinhos do tecido. ' +
              '<b>Tapar buracos</b>: ar cercado pelo tecido. <b>Casco convexo</b>: ar dentro do casco. <b>Núcleo convexo</b>: maior subconjunto convexo (remoção de concavidades). <b>Abrir/Fechar</b>: morfologia 3×3. <b>Suavizar</b>: maioria 3×3. <b>Negativo</b>: troca tecido ↔ ar.',
        lang: 'EN' },
  en: { title: 'Phantom editor', lead: 'Paint an N×N phantom with the dictionary tissues and save it as a .json file for the simulator. Left button paints the selected tissue, right button paints air.',
        save: 'save (.json)', copy: 'copy JSON', load: 'load (.json)', name: 'name', back: 'simulator ↗', fillOff: 'fill: off', fillOn: 'fill: on',
        undo: 'undo', holes: 'fill holes', erode: 'erode', grow: 'grow', hull: 'convex hull', core: 'convex core', open: 'open', close: 'close', smooth: 'smooth', neg: 'negative', clear: 'clear',
        status: (t, n, a, N) => `${t}: ${n} pixels · air: ${a} · N = ${N}`, loaded: 'phantom loaded: ', bad: 'invalid phantom: ', copied: 'copied ✓', copyFail: 'could not copy: the JSON is in the box below',
        help: '<b>Fill</b>: when on, a left click fills the connected air region under the cursor with the selected tissue; a right click turns the connected region of the selected tissue into air. ' +
              'The tools act on the selected tissue only: gains take air pixels, losses become air. <b>Erode</b>: pixels with fewer than three orthogonal neighbors of the same tissue. <b>Grow</b>: air with two or more neighbors of the tissue. ' +
              '<b>Fill holes</b>: air enclosed by the tissue. <b>Convex hull</b>: air inside the hull. <b>Convex core</b>: largest convex subset (concavity removal). <b>Open/Close</b>: 3×3 morphology. <b>Smooth</b>: 3×3 majority. <b>Negative</b>: swaps tissue ↔ air.',
        lang: 'PT' },
};
const KEYS = Object.keys(TISSUES), AIR = KEYS.indexOf('air');
if (AIR < 0) throw new Error('the tissue dictionary needs an "air" entry');
const st = { lang: 'pt', N: 9, grid: null, sel: KEYS.indexOf('gm') >= 0 ? KEYS.indexOf('gm') : 0, fill: false, history: [], drawing: false, value: null, last: null, filename: null };
const L = () => I18N[st.lang];
const loc = v => (v && typeof v === 'object') ? (v[st.lang] || v.pt || v.en || '') : (v == null ? '' : String(v));
const blank = N => Array.from({ length: N }, () => new Array(N).fill(AIR));
st.grid = blank(st.N);

/* ---------- drawing ---------- */
const cv = $('grid'), ctx = cv.getContext('2d');
function draw() {
  const N = st.N, W = cv.width, cell = W / N;
  ctx.clearRect(0, 0, W, W);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { ctx.fillStyle = TISSUES[KEYS[st.grid[i][j]]].color; ctx.fillRect(j * cell, i * cell, cell, cell); }
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
  for (let k = 0; k <= N; k++) { const x = Math.round(k * cell) + 0.5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, W); ctx.moveTo(0, x); ctx.lineTo(W, x); ctx.stroke(); }
  const n = count(st.sel), a = count(AIR);
  $('status').textContent = L().status(loc(TISSUES[KEYS[st.sel]].name), n, a, N);
  for (const b of $('palette').children) b.classList.toggle('sel', +b.dataset.i === st.sel);
}
function count(v) { let n = 0; for (const row of st.grid) for (const x of row) if (x === v) n++; return n; }
function cellAt(ev) {
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * st.N, y = (ev.clientY - r.top) / r.height * st.N;
  const i = Math.floor(y), j = Math.floor(x);
  return (i >= 0 && i < st.N && j >= 0 && j < st.N) ? [i, j] : null;
}
function push() { st.history.push(st.grid.map(r => r.slice())); if (st.history.length > 200) st.history.shift(); }

/* ---------- mouse ---------- */
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  const c = cellAt(e); if (!c) return;
  const [i, j] = c;
  if (st.fill) {
    if (e.button === 0 && st.grid[i][j] === AIR) { push(); fillComponent(i, j, AIR, st.sel); }
    else if (e.button === 2 && st.grid[i][j] === st.sel) { push(); fillComponent(i, j, st.sel, AIR); }
    draw(); return;
  }
  if (e.button === 0) st.value = st.sel; else if (e.button === 2) st.value = AIR; else return;
  push(); st.drawing = true; st.last = c; cv.setPointerCapture(e.pointerId);
  st.grid[i][j] = st.value; draw();
});
cv.addEventListener('pointermove', e => {
  if (!st.drawing) return;
  const c = cellAt(e); if (!c) return;
  const [i0, j0] = st.last, [i1, j1] = c, steps = Math.max(Math.abs(i1 - i0), Math.abs(j1 - j0));
  for (let k = 0; k <= steps; k++) { const t = steps ? k / steps : 1; st.grid[Math.round(i0 + t * (i1 - i0))][Math.round(j0 + t * (j1 - j0))] = st.value; }
  st.last = c; draw();
});
const stop = () => { st.drawing = false; st.last = null; };
cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);

/* ---------- tools: all on the selected tissue's mask; gains from air only, losses to air ---------- */
const mask = () => st.grid.map(r => r.map(v => v === st.sel));
function apply(newMask) {
  for (let i = 0; i < st.N; i++) for (let j = 0; j < st.N; j++) {
    const old = st.grid[i][j] === st.sel;
    if (old && !newMask[i][j]) st.grid[i][j] = AIR;
    else if (!old && newMask[i][j] && st.grid[i][j] === AIR) st.grid[i][j] = st.sel;
  }
  draw();
}
function neighbors4(m) {   // number of true orthogonal neighbors per pixel
  const N = st.N, n = Array.from({ length: N }, () => new Array(N).fill(0));
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (m[i][j]) { if (i > 0) n[i - 1][j]++; if (i < N - 1) n[i + 1][j]++; if (j > 0) n[i][j - 1]++; if (j < N - 1) n[i][j + 1]++; }
  return n;
}
function components(pred) {   // 4-connected component labels of the pixels satisfying pred(value); 0 elsewhere
  const N = st.N, lab = Array.from({ length: N }, () => new Array(N).fill(0)); let next = 0;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (pred(st.grid[i][j]) && !lab[i][j]) {
    next++; const q = [[i, j]]; lab[i][j] = next;
    while (q.length) { const [a, b] = q.pop(); for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const x = a + da, y = b + db; if (x >= 0 && x < N && y >= 0 && y < N && pred(st.grid[x][y]) && !lab[x][y]) { lab[x][y] = next; q.push([x, y]); } } }
  }
  return lab;
}
function fillComponent(i, j, source, target) {
  const lab = components(v => v === source), L0 = lab[i][j];
  for (let a = 0; a < st.N; a++) for (let b = 0; b < st.N; b++) if (lab[a][b] === L0) st.grid[a][b] = target;
}
function fillHoles(m) {   // true pixels plus every false region not connected to the border
  const N = st.N, out = m.map(r => r.slice()), seen = Array.from({ length: N }, () => new Array(N).fill(false)), q = [];
  for (let i = 0; i < N; i++) for (const j of [0, N - 1]) if (!m[i][j] && !seen[i][j]) { seen[i][j] = true; q.push([i, j]); }
  for (let j = 0; j < N; j++) for (const i of [0, N - 1]) if (!m[i][j] && !seen[i][j]) { seen[i][j] = true; q.push([i, j]); }
  while (q.length) { const [a, b] = q.pop(); for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const x = a + da, y = b + db; if (x >= 0 && x < N && y >= 0 && y < N && !m[x][y] && !seen[x][y]) { seen[x][y] = true; q.push([x, y]); } } }
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!m[i][j] && !seen[i][j]) out[i][j] = true;
  return out;
}
function morph(m, dilate) {   // 3 x 3 dilation or erosion of a boolean mask
  const N = st.N, out = Array.from({ length: N }, () => new Array(N).fill(false));
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    let all = true, any = false;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const x = i + a, y = j + b, v = (x >= 0 && x < N && y >= 0 && y < N) ? m[x][y] : false; all = all && v; any = any || v; }
    out[i][j] = dilate ? any : all;
  }
  return out;
}
function majority(m) {
  const N = st.N, out = Array.from({ length: N }, () => new Array(N).fill(false));
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    let n = 0; for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const x = i + a, y = j + b; if (x >= 0 && x < N && y >= 0 && y < N && m[x][y]) n++; }
    out[i][j] = n >= 5;   // 9 cells, border cells count as false
  }
  return out;
}
function hullMask(m) {   // pixels inside the convex hull of the true pixels (Andrew's monotone chain, then point-in-polygon on cell centers)
  const pts = []; for (let i = 0; i < st.N; i++) for (let j = 0; j < st.N; j++) if (m[i][j]) pts.push([j, i]);
  if (pts.length < 3) return m;
  pts.sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = []; for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  const upper = []; for (const p of pts.slice().reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  const hull = lower.slice(0, -1).concat(upper.slice(0, -1));
  if (hull.length < 3) return m;
  const inside = (x, y) => { for (let k = 0; k < hull.length; k++) { const a = hull[k], b = hull[(k + 1) % hull.length]; if (cross(a, b, [x, y]) < -1e-9) return false; } return true; };
  return m.map((row, i) => row.map((v, j) => v || inside(j, i)));
}
function convexCore(m, maxIters = 20) {   // Borgefors and Strand's concavity removal (see the Python editor for the full description)
  const N = st.N; let cur = m.map(r => r.slice());
  for (let it = 0; it < maxIters; it++) {
    const h = hullMask(cur); let anyDef = false;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (h[i][j] && !cur[i][j]) anyDef = true;
    if (!anyDef) break;
    // geodesic distance of the background from the image border, the object being a wall
    const dist = Array.from({ length: N }, () => new Array(N).fill(-1)), q = [];
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i === 0 || j === 0 || i === N - 1 || j === N - 1) && !cur[i][j]) { dist[i][j] = 0; q.push([i, j]); }
    for (let k = 0; k < q.length; k++) { const [a, b] = q[k]; for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const x = a + da, y = b + db; if (x >= 0 && x < N && y >= 0 && y < N && !cur[x][y] && dist[x][y] < 0) { dist[x][y] = dist[a][b] + 1; q.push([x, y]); } } }
    let ci = -1, cj = -1, dmax = 0;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (h[i][j] && !cur[i][j] && dist[i][j] > dmax) { dmax = dist[i][j]; ci = i; cj = j; }
    if (dmax <= 0) break;
    const halves = [(i, j) => i > ci - 0.5, (i, j) => i < ci + 0.5, (i, j) => j > cj - 0.5, (i, j) => j < cj + 0.5,
                    (i, j) => (i - j) > (ci - cj) - 0.5, (i, j) => (i - j) < (ci - cj) + 0.5, (i, j) => (i + j) > (ci + cj) - 0.5, (i, j) => (i + j) < (ci + cj) + 0.5];
    let best = null, bestN = Infinity;
    for (const f of halves) { let n = 0; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (cur[i][j] && f(i, j)) n++; if (n > 0 && n < bestN) { bestN = n; best = f; } }
    if (!best) break;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (cur[i][j] && best(i, j)) cur[i][j] = false;
  }
  return cur;
}
const TOOLS = [
  ['toggle', () => { st.fill = !st.fill; $('t_toggle').classList.toggle('on', st.fill); $('t_toggle').textContent = st.fill ? L().fillOn : L().fillOff; }],
  ['undo', () => { if (st.history.length) { st.grid = st.history.pop(); st.N = st.grid.length; $('nsel').value = String(st.N); draw(); } }],
  ['holes', () => { push(); apply(fillHoles(mask())); }],
  ['erode', () => { push(); const m = mask(), n = neighbors4(m); apply(m.map((r, i) => r.map((v, j) => v && n[i][j] >= 3))); }],
  ['grow', () => { push(); const m = mask(), n = neighbors4(m); apply(m.map((r, i) => r.map((v, j) => v || n[i][j] >= 2))); }],
  ['hull', () => { push(); apply(hullMask(mask())); }],
  ['core', () => { push(); apply(convexCore(mask())); }],
  ['open', () => { push(); apply(morph(morph(mask(), false), true)); }],
  ['close', () => { push(); apply(morph(morph(mask(), true), false)); }],
  ['smooth', () => { push(); apply(majority(mask())); }],
  ['neg', () => { push(); st.grid = st.grid.map(r => r.map(v => v === st.sel ? AIR : (v === AIR ? st.sel : v))); draw(); }],
  ['clear', () => { push(); st.grid = blank(st.N); draw(); }],
];
for (const [key, fn] of TOOLS) { const b = document.createElement('button'); b.id = 't_' + key; b.addEventListener('click', fn); $('tools').appendChild(b); }

/* ---------- palette, size, language ---------- */
KEYS.forEach((k, i) => {
  const b = document.createElement('button'); b.dataset.i = i;
  const sw = document.createElement('i'); sw.style.background = TISSUES[k].color; b.appendChild(sw); b.appendChild(document.createElement('span'));
  b.addEventListener('click', () => { st.sel = i; draw(); });
  $('palette').appendChild(b);
});
$('nsel').addEventListener('change', e => { push(); st.N = +e.target.value; st.grid = blank(st.N); draw(); });
function applyLang() {
  const d = L();
  document.title = d.title; $('title').innerHTML = `${d.title} <small>MRIsim</small> <span class="ver">v1</span>`; $('lead').textContent = d.lead;
  $('save').textContent = d.save; $('copy').textContent = d.copy; $('load').textContent = d.load; $('lName').textContent = d.name; $('back').textContent = d.back; $('lang').textContent = d.lang;
  for (const [key] of TOOLS) $('t_' + key).textContent = key === 'toggle' ? (st.fill ? d.fillOn : d.fillOff) : d[key];
  for (const b of $('palette').children) b.lastChild.textContent = loc(TISSUES[KEYS[+b.dataset.i]].name);
  $('help').innerHTML = d.help;
  document.documentElement.lang = st.lang === 'pt' ? 'pt-BR' : 'en';
  draw();
}
$('lang').addEventListener('click', () => { st.lang = st.lang === 'pt' ? 'en' : 'pt'; applyLang(); });

/* ---------- files ---------- */
function definition() {
  const stem = ($('pname').value.trim() || 'fantoma').replace(/\.json$/i, '');
  return { format: 'didactic-mri-phantom/1', id: stem, name: { pt: stem, en: stem }, background: 'air', grid: { N: st.N, labels: st.grid.map(r => r.map(v => KEYS[v])) } };
}
function jsonText() { return JSON.stringify(definition(), null, 1); }
$('save').addEventListener('click', () => {
  const txt = jsonText(), a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = definition().id + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $('json').hidden = false; $('json').value = txt;      // also shown, for viewers where downloads are blocked
});
$('copy').addEventListener('click', () => {
  const txt = jsonText(), btn = $('copy');
  const done = ok => { btn.textContent = ok ? L().copied : L().copyFail; if (!ok) { $('json').hidden = false; $('json').value = txt; $('json').select(); } setTimeout(() => { btn.textContent = L().copy; }, 2200); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); else done(false);
});
$('load').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const def = JSON.parse(rd.result);
      if (!def || typeof def !== 'object' || (!Array.isArray(def.shapes) && !def.grid)) throw new Error('not a phantom file');
      const N = def.grid ? (def.grid.N || def.grid.labels.length) : st.N;
      if (!NS.includes(N)) throw new Error('N = ' + N + ' (' + NS[0] + '…' + NS[NS.length - 1] + ')');
      const ph = E.renderPhantom(def, N, TISSUES);          // shapes rendered at the current N; a grid imposes its own
      push(); st.N = N; $('nsel').value = String(N);
      st.grid = Array.from({ length: N }, (_, i) => Array.from({ length: N }, (_, j) => KEYS.indexOf(ph.label[i * N + j])));
      $('pname').value = def.id || file.name.replace(/\.json$/i, '');
      $('json').hidden = true; draw(); $('msg').classList.remove('err'); $('msg').textContent = L().loaded + loc(def.name || def.id);
    } catch (ex) { $('msg').classList.add('err'); $('msg').textContent = L().bad + ex.message; }
  };
  rd.readAsText(file); e.target.value = '';
});
// Back link: the page that linked here (local file, GitHub Pages or artifact), else the hosted simulator.
if (document.referrer) $('back').href = document.referrer; else if (location.protocol === 'file:') $('back').href = 'sequence_lab_v1.html'; else $('back').href = 'https://w40n5k1.github.io/MRIsim/';

applyLang();
})();
</script>
