<script>// By Bruno Mota - METAbio
/* seq_engine_v1.js — generic engine for didactic 2D imaging sequences described as text (JSON).
 *
 * A sequence file declares parameters, derived variables and a list of events per shot (repetition):
 *   rf    {t, dur, flip (deg), axis 'x'|'y', refocus?}   instantaneous pulse: the whole rotation is applied at the center t + dur/2
 *                                                        and relaxation is never interrupted, so the textbook formulas hold exactly;
 *                                                        dur is only the drawn width, inside which the displayed magnetization is the
 *                                                        physical state turned by the angle accrued so far (visible rotation);
 *                                                        refocus: k -> -k at the center, otherwise (excitation) the k label resets to 0
 *   grad  {axis 'x'|'y', t, dur, area}                   constant lobe; area in dk = 1/FOV units (k moved by the lobe)
 *   adc   {t, dur, n}                                    readout window; n samples at the centers of n equal sub-intervals
 *   spoil {t}                                            ideal spoiler: transverse magnetization zeroed at t
 *   repeat {count, var, vars?, events}                   loop; the loop variable and local vars are visible inside
 * Numbers may be expressions (strings) in the parameters, the table values, the shot index n, loop variables and
 * the derived vars (evaluated in order). Expressions are plain JavaScript arithmetic evaluated with Function();
 * a sequence file is code you choose to run, like a notebook cell.
 *
 * Physics (same didactic model as the hand-written programs): N x N isochromats (N odd) at x,y in {-(N-1)/2..(N-1)/2}, rotating frame
 * (precession only under gradients: m -> m exp(-i 2 pi (dkx x + dky y)/N)), instantaneous hard pulses, exponential relaxation,
 * signal S = sum of (Mx + i My) over the pixels. Samples are the forward DFT of the pixel magnetizations.
 * Units: ms, dk.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SeqEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  // N (odd) pixels per side; pixel p = row*N + col, row 0 at the top (y = +HALF), x = col - HALF
  function pixelXY(p, N) { const H = (N - 1) / 2; return { x: (p % N) - H, y: H - Math.floor(p / N) }; }
  /* ---------- phantoms (format didactic-mri-phantom/1) ----------
   * A phantom file names a background tissue and lists shapes painted in order, in coordinates normalized to [-1, 1]
   * over the field of view (pixel centers at x = (col - H)/(N/2), y = (H - row)/(N/2)):
   *   {type: 'rect', tissue, x: [x0, x1], y: [y0, y1]}   {type: 'disk', tissue, center: [cx, cy], r}   (a disk claims at least its nearest pixel)
   * or carries a painted pixel map, grid: {N, labels: [[keys...], ...]}, resampled to any odd N by nearest pixel (shapes go on top).
   * An optional pd expression in x, y multiplies the tissue's proton density.
   * renderPhantom returns {label[], pdf[], M0[], T1[], T2[], tissues} for the N x N grid (pixel p = row*N + col). */
  function resampleGrid(grid, N) {
    const rows = grid.labels, n = grid.N || rows.length;
    if (rows.length !== n || rows.some(r => r.length !== n)) throw new Error('phantom grid is not N x N');
    const src = []; for (let i = 0; i < N; i++) src.push(Math.min(n - 1, Math.max(0, Math.round((i - (N - 1) / 2) * n / N + (n - 1) / 2))));
    const out = []; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) out.push(rows[src[i]][src[j]]);
    return out;
  }
  function renderPhantom(def, N, tissues) {
    if (N % 2 === 0 || N < 1) throw new Error('N must be odd');
    const H = (N - 1) / 2, NP = N * N, X = new Array(NP), Y = new Array(NP);
    for (let p = 0; p < NP; p++) { const q = pixelXY(p, N); X[p] = q.x; Y[p] = q.y; }
    let label = def.grid ? resampleGrid(def.grid, N) : new Array(NP).fill(def.background || 'air');
    for (const sh of def.shapes || []) {
      for (let p = 0; p < NP; p++) {
        const xn = X[p] / (N / 2), yn = Y[p] / (N / 2);
        if (sh.type === 'rect') { if (xn >= sh.x[0] && xn <= sh.x[1] && yn >= sh.y[0] && yn <= sh.y[1]) label[p] = sh.tissue; }
        else if (sh.type !== 'disk') throw new Error('unknown shape ' + sh.type);
      }
      if (sh.type === 'disk') {
        const [cx, cy] = sh.center || [0, 0], rpx = Math.max(sh.r * N / 2, 0.5);
        let best = 0, bestD = Infinity, any = false;
        for (let p = 0; p < NP; p++) { const d = Math.hypot(X[p] - cx * N / 2, Y[p] - cy * N / 2); if (d <= rpx) { label[p] = sh.tissue; any = true; } if (d < bestD) { bestD = d; best = p; } }
        if (!any) label[best] = sh.tissue;
      }
    }
    const pdf = new Array(NP).fill(1);
    if (def.pd) for (let p = 0; p < NP; p++) pdf[p] = evalExpr(def.pd, { x: X[p] / (N / 2), y: Y[p] / (N / 2), N });
    const M0 = new Array(NP), T1 = new Array(NP), T2 = new Array(NP);
    for (let p = 0; p < NP; p++) { const t = tissues[label[p]]; if (!t) throw new Error('unknown tissue ' + label[p]); M0[p] = t.pd * pdf[p]; T1[p] = t.T1; T2[p] = t.T2; }
    return { label, pdf, M0, T1, T2, tissues };
  }
  // helpers available to sequence expressions
  function range(a, b, step) { step = step || (b >= a ? 1 : -1); const out = []; for (let v = a; step > 0 ? v <= b + 1e-9 : v >= b - 1e-9; v += step) out.push(v); return out; }
  function centric(H) { const out = [0]; for (let k = 1; k <= H; k++) out.push(k, -k); return out; }
  function indexOf(arr, v) { return arr.indexOf(v); }
  function rev(arr) { return arr.slice().reverse(); }

  /* ---------- expressions ---------- */
  const fnCache = new Map();
  function evalExpr(expr, ctx) {
    if (typeof expr === 'number') return expr;
    if (typeof expr === 'boolean') return expr ? 1 : 0;
    if (expr == null) return 0;
    if (typeof expr !== 'string') throw new Error('bad expression ' + JSON.stringify(expr));
    const keys = Object.keys(ctx), sig = keys.join(',') + '|' + expr;
    let fn = fnCache.get(sig);
    if (!fn) { fn = new Function(...keys, 'with (Math) { return (' + expr + '); }'); fnCache.set(sig, fn); }
    const v = fn(...keys.map(k => ctx[k]));
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (typeof v !== 'number' || Number.isNaN(v)) throw new Error('expression "' + expr + '" gave ' + v);
    return v;
  }
  function evalVars(vars, ctx) { if (!vars) return; for (const [k, e] of Object.entries(vars)) ctx[k] = evalExpr(e, ctx); }
  // text templates: ${expr} substituted; |v| formatting helpers in ctx
  function fmtText(tpl, ctx) {
    return String(tpl).replace(/\$\{([^}]+)\}/g, (_, e) => {
      const v = evalExpr(e, ctx); const r = Math.round(v * 100) / 100;
      return (r > 0 && /^\+/.test(e) ? '+' : '') + (r < 0 ? '−' + (-r) : String(r));
    });
  }

  /* ---------- compile: sequence definition + parameter values -> absolute schedule ---------- */
  function paramDefaults(def) {
    const P = {};
    for (const p of def.params || []) P[p.id] = p.type === 'select' ? p.default : (p.type === 'checkbox' ? (p.default ? 1 : 0) : p.default);
    return P;
  }
  function evalTable(v, ctx) { return typeof v === 'string' ? (new Function(...Object.keys(ctx), 'with (Math) { return (' + v + '); }'))(...Object.values(ctx)) : v; }
  function baseContext(def, P, N) {
    const ctx = { N, HALF: (N - 1) / 2, PI: Math.PI, range, centric, indexOf, rev };
    for (const [k, v] of Object.entries(def.constants || {})) ctx[k] = v;
    for (const [k, v] of Object.entries(def.tables || {})) ctx[k] = evalTable(v, ctx);
    for (const p of def.params || []) {

    S.bands.forEach((bd, i) => { const xm = bandX(i) + bandW(i) / 2, b = bandLabel(loc(bd.label), bandW(i)); out.push(`<text class="trh" id="trh${i}" x="${f(xm)}" y="17" text-anchor="middle" font-size="${b.size}" fill="${C.text}">${markup(b.s, b.size)}</text>`); });
    // baselines and row labels
    for (const [key, y] of Object.entries(R)) {
      for (const pc of pieces(L, S, 0, S.tEnd)) out.push(`<line x1="${f(x(pc.t0))}" y1="${y}" x2="${f(x(pc.t1))}" y2="${y}" stroke="${C.base}" stroke-width="1.2"${pc.dashed ? ' stroke-dasharray="5 5"' : ''}/>`);
      if (key === 'gy' || key === 'gx') {
        const ax = key === 'gy' ? 'y' : 'x', sub = key === 'gy' ? 'pe' : 'fe';
        out.push(`<text x="${GUT - 12}" y="${y + 1}" text-anchor="end" font-size="18" font-weight="600" fill="${C.text}">G<tspan font-size="12" dy="3">${sub}</tspan><tspan dy="-3" font-size="15" font-weight="400"> = ∂B</tspan><tspan font-size="10" dy="3" font-weight="400">z</tspan><tspan dy="-3" font-size="15" font-weight="400">/∂${ax}</tspan></text>`);
        out.push(`<text x="${GUT - 12}" y="${y + 17}" text-anchor="end" font-size="11.5" fill="${C.text}">${key === 'gy' ? lab.peDesc : lab.feDesc}</text>`);
      } else out.push(`<text x="${GUT - 12}" y="${y + 6}" text-anchor="end" font-size="18" font-weight="600" fill="${C.text}">${key === 'rf' ? 'RF' : 'Signal'}</text>`);
    }
    // amplitude scale: the strongest x gradient (readout) is 24 px high
    const grads = S.events.filter(e => e.type === 'grad'), rfs = S.events.filter(e => e.type === 'rf'), adcs = S.events.filter(e => e.type === 'adc');
    const ampRef = Math.max(1e-9, ...grads.filter(g => g.axis === 'x').map(g => Math.abs(g.amp)), ...grads.map(g => Math.abs(g.amp)) .map(v => v * 0.6));
    const hOf = g => 24 * g.amp / ampRef;
    // RF
    for (const r of rfs) {
      const A = Math.max(12, Math.min(38, 20 + 18 * (Math.abs(r.flip) - 90) / 90)), halfW = 0.9 * r.dur * S_PX;
      out.push(`<path d="${sincPath(x(r.tc), R.rf, halfW, A)}" fill="none" stroke="${C.rf}" stroke-width="1.6"/>`);
      out.push(`<text x="${f(x(r.tc))}" y="${f(R.rf - A - (A > 30 ? 4 : 10))}" text-anchor="middle" font-size="14" fill="${C.text}">${f(r.flip)}°</text>`);
    }
    // gradients (ghost tables first, then lobes)
    for (const g of grads) {
      const y0 = g.axis === 'y' ? R.gy : R.gx, col = g.axis === 'y' ? C.gy : C.gx;
      if (g.def.ghost && g.ctx[g.def.ghost]) for (const v of g.ctx[g.def.ghost]) { if (v === 0 || Math.abs(v * (g.dur ? 1 / g.dur : 0) - g.amp) < 1e-9) continue; const hh = 24 * (v / g.dur) / ampRef; out.push(`<path d="${rect(x(g.t), x(g.t1), y0, hh)}" fill="none" stroke="${C.ghost}" stroke-width="1" stroke-dasharray="3 2"/>`); }
    }
    for (const g of grads) {
      const y0 = g.axis === 'y' ? R.gy : R.gx, col = g.axis === 'y' ? C.gy : C.gx, h = hOf(g);
      if (Math.abs(g.area) < 1e-9) out.push(`<line x1="${f(x(g.t))}" y1="${y0}" x2="${f(x(g.t1))}" y2="${y0}" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>`);
      else out.push(`<path d="${rect(x(g.t), x(g.t1), y0, h)}" fill="${col}" stroke="${col}" stroke-width="1"/>`);
      if (g.label != null && S.N <= 7) out.push(`<text x="${f(x(g.t1) + 4)}" y="${f(y0 - h + (h >= 0 ? -3 : 12))}" font-size="12" font-weight="600" fill="${col}">${esc(g.label)}</text>`);
    }
    // signal: optional T2 envelope of the largest possible signal, then the simulated signal in ADC windows
    const yS = v => R.sig - AMP_SIG * v / sim.Smax, T2 = sim.relax.T2;
    if (S.def.envelope && Number.isFinite(T2) && rfs.length) {
      const r0 = rfs[0], tA0 = S.shots[0].tActive; let env = '', last = null;
      for (let t = r0.t1; t <= tA0; t += 0.5) { let tp = 0; for (const r of rfs) if (r !== r0 && r.shot === 0) tp += Math.max(0, Math.min(t, r.t1) - r.t); last = sim.Smax * Math.exp(-(t - r0.t1 - tp) / T2); env += (env ? 'L' : 'M') + f(x(t)) + ',' + f(yS(last)) + ' '; }
      out.push(`<path d="${env}" fill="none" stroke="${C.env}" stroke-width="1" stroke-dasharray="3 3"/>`);
      out.push(`<text x="${f(x(tA0) + 4)}" y="${f(yS(last) + 4)}" font-size="11" fill="${C.env}">${lab.envDesc}</text>`);
    }
    for (const sh of S.shots) {                 // net transverse magnetization |S(t)| through the whole active part
      const i0 = SeqIndex(sim, sh.T0), i1 = SeqIndex(sim, Math.min(S.tEnd, sh.T0 + S.TR)); let mag = '';
      for (let i = i0; i <= i1; i++) mag += (i === i0 ? 'M' : 'L') + f(x(sim.times[i])) + ',' + f(yS(Math.hypot(sim.sRe[i], sim.sIm[i]))) + ' ';
      out.push(`<path d="${mag}" fill="none" stroke="${C.sigGhost}" stroke-width="0.9" stroke-dasharray="2 2"/>`);
      out.push(`<g clip-path="url(#reveal)"><path d="${mag}" fill="none" stroke="${C.env}" stroke-width="1.1"/></g>`);
    }
    for (const a of adcs) {
      const i0 = SeqIndex(sim, a.t - 0.8), i1 = SeqIndex(sim, a.t1 + 0.8);
      let line = '', env = `M${f(x(sim.times[i0]))},${R.sig} `;
      for (let i = i0; i <= i1; i++) { const xx = f(x(sim.times[i])); line += (i === i0 ? 'M' : 'L') + xx + ',' + f(yS(sim.sRe[i])) + ' '; env += 'L' + xx + ',' + f(yS(Math.hypot(sim.sRe[i], sim.sIm[i]))) + ' '; }
      env += `L${f(x(sim.times[i1]))},${R.sig} Z`;
      out.push(`<path d="${line}" fill="none" stroke="${C.sigGhost}" stroke-width="1.2"/>`);
      out.push(`<g clip-path="url(#reveal)"><path d="${env}" fill="${C.sigFill}" stroke="none"/><path d="${line}" fill="none" stroke="${C.sig}" stroke-width="1.7"/>`);
      for (const s of sim.samples) if (s.adc === a) out.push(`<circle cx="${f(x(s.t))}" cy="${f(yS(s.re))}" r="3.4" fill="${phaseColor(Math.atan2(s.im, s.re))}" stroke="#333" stroke-width="0.8"/>`);
      out.push('</g>');
      if (a.def.label) out.push(`<text x="${f(x(a.tc) + 8)}" y="${R.sig - AMP_SIG - 4}" font-size="13" fill="${C.sig}">${esc(loc(a.def.label))}</text>`);
    }
    // marks (dashed verticals) and arrows (shot 0)
    for (const m of S.marks) {
      const col = C[m.style] || C.te, yb = Y_LEVEL[Math.min(1, m.level || 0)];
      out.push(`<line x1="${f(x(m.t))}" y1="${R.rf - 24}" x2="${f(x(m.t))}" y2="${yb}" stroke="${col}" stroke-width="1" stroke-dasharray="4 3"/>`);
      if (m.label) out.push(`<text x="${f(x(m.t) + 4)}" y="${R.rf + 18}" font-size="13" font-weight="600" fill="${col}">${markup(loc(m.label), 13)}</text>`);
    }
    for (const a of S.arrows) {
      const col = C[a.style] || C.te, y = Y_LEVEL[Math.min(1, a.level || 0)], ps = pieces(L, S, a.t, a.t1);
      ps.forEach((pc, i) => out.push(`<line x1="${f(x(pc.t0))}" y1="${y}" x2="${f(x(pc.t1))}" y2="${y}" stroke="${col}" stroke-width="4"${pc.dashed ? ' stroke-dasharray="6 6"' : ''}${i === 0 ? ` marker-start="url(#ah_${a.style || 'te'})"` : ''}${i === ps.length - 1 ? ` marker-end="url(#ah_${a.style || 'te'})"` : ''}/>`));
      out.push(`<text x="${f((x(a.t) + x(a.t1)) / 2)}" y="${y + 22}" text-anchor="middle" font-size="20" font-weight="700" fill="${col}">${markup(loc(a.label), 20)}${a.def.sub ? `<tspan font-size="11" font-weight="400" dx="6">${esc(loc(a.def.sub))}</tspan>` : ''}</text>`);
    }
    // scale bar, cursor
    const sx1 = W - RIGHT - 10 * S_PX, sx2 = W - RIGHT, ysb = Y_LEVEL[1];
    out.push(`<line x1="${f(sx1)}" y1="${ysb}" x2="${f(sx2)}" y2="${ysb}" stroke="${C.text}" stroke-width="1.5"/><line x1="${f(sx1)}" y1="${ysb - 4}" x2="${f(sx1)}" y2="${ysb + 4}" stroke="${C.text}" stroke-width="1.5"/><line x1="${f(sx2)}" y1="${ysb - 4}" x2="${f(sx2)}" y2="${ysb + 4}" stroke="${C.text}" stroke-width="1.5"/>`);
    out.push(`<text x="${f((sx1 + sx2) / 2)}" y="${ysb + 16}" text-anchor="middle" font-size="11" fill="${C.text}">${lab.scale}</text>`);
    const cx = opts.cursorT == null ? GUT : x(opts.cursorT);
    out.push(`<g id="cursor" transform="translate(${f(cx)},0)" style="${opts.cursorT == null && !opts.showCursor ? 'display:none' : ''}"><polygon points="-6,36 6,36 0,44" fill="${C.cursor}"/><line x1="0" y1="42" x2="0" y2="${H - 8}" stroke="${C.cursor}" stroke-width="1.6"/></g>`);
    out.push('</svg>');
    return { svg: out.join('\n'), L, bandX, bandW, colors: C };
  }
  function SeqIndex(sim, t) { const a = sim.times; let lo = 0, hi = a.length - 1; if (t <= a[0]) return 0; if (t >= a[hi]) return hi; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (a[m] <= t) lo = m; else hi = m; } return (t - a[lo] < a[hi] - t) ? lo : hi; }
  return { build, layout, markup, phaseColor, ROWS, COLORS: C };
});
</script>

<script>const SEQUENCES = [{"id":"se","format":"didactic-mri-sequence/1","name":{"pt":"Spin Echo","en":"Spin Echo"},"subtitle":{"pt":"um exemplo de sequência de pulsos, e o sinal de RF gerado","en":"an example of a pulse sequence, and the RF signal it generates"},"lead":{"pt":"Um 90° e um 180° por repetição; uma linha k_y por TR, N TRs. TE curto e TR longo dão ponderação em densidade de prótons; TE longo, em T2; TR curto, em T1. Fatia já selecionada; matriz N×N no plano xy, um isocromato por pixel, referencial girante. Arraste sobre o diagrama para percorrer o tempo.","en":"One 90° and one 180° per repetition; one k_y line per TR, N TRs. Short TE and long TR give proton-density weighting; long TE, T2; short TR, T1. Slice already selected; N×N array in the xy plane, one isochromat per pixel, rotating frame. Drag across the diagram to scrub through time."},"relax":{"T1":80,"T2":60},"phantom":"squareAir","params":[{"id":"TE","label":"TE","min":22,"max":200,"step":2,"default":32,"unit":"ms"},{"id":"TR","label":"TR","min":100,"max":4000,"step":50,"default":2000,"unit":"ms"},{"id":"spoiler","type":"checkbox","default":true,"label":{"pt":"zerar M⊥ ao fim do TR (spoiler ideal)","en":"zero M⊥ at end of TR (ideal spoiler)"}}],"constants":{"w":5,"tLead":2,"tauEnc":6,"tauRo":12},"tables":{"pe":"range(HALF, -HALF, -1)"},"shots":"N","TR":"TR","vars":{"Apre":"N/2","t90":"tLead + w/2","tEnc":"tLead + w","t180":"t90 + TE/2","tEcho":"t90 + TE"},"shotVars":{"step":"pe[n]"},"shotLabel":"TR ${n+1} · G_pe = ${+step} → k_y = ${+(-step)}","events":[{"type":"rf","t":"tLead","dur":"w","flip":90,"axis":"y","desc":{"pt":"pulso de 90° (rotação em torno de y)","en":"90° pulse (rotation about y)"}},{"type":"grad","axis":"x","t":"tEnc","dur":"tauEnc","area":"Apre","desc":{"pt":"pré-fase de leitura (Gfe): kₓ vai a +${N/2}","en":"readout prephaser (Gfe): kₓ goes to +${N/2}"}},{"type":"grad","axis":"y","t":"tEnc","dur":"tauEnc","area":"step","label":"${+step}","ghost":"pe","desc":{"pt":"codificação de fase (Gpe): k_y vai a ${+step}","en":"phase encoding (Gpe): k_y goes to ${+step}"}},{"type":"rf","t":"t180 - w/2","dur":"w","flip":180,"axis":"x","refocus":true,"desc":{"pt":"pulso de 180° (rotação em torno de x): fases invertidas, k → −k","en":"180° pulse (rotation about x): phases reversed, k → −k"}},{"type":"grad","axis":"x","t":"tEcho - tauRo/2","dur":"tauRo","area":"N","desc":{"pt":"leitura: Gfe varre kₓ de ${-N/2} a +${N/2}","en":"readout: Gfe sweeps kₓ from ${-N/2} to +${N/2}"}},{"type":"adc","t":"tEcho - tauRo/2","dur":"tauRo","n":"N","label":"SE","desc":{"pt":"amostras em kₓ = ${-HALF}…+${HALF}","en":"samples at kₓ = ${-HALF}…+${HALF}"}},{"type":"spoil","t":"TR","if":"spoiler"},{"type":"arrow","t":"t90","to":"tEcho","label":"T_E","style":"te","level":0},{"type":"arrow","t":"t90","to":"TR + t90","label":"T_R","style":"tr","level":1},{"type":"mark","t":"t90","style":"te"},{"type":"mark","t":"t180","label":"T_E/2","style":"te"},{"type":"mark","t":"tEcho","label":"T_E","style":"te"}],"notes":{"pt":["Sequência: 90° em torno de y; pré-fasador de leitura (+N/2 Δk) e codificação de fase simultâneos, antes do 180°; 180° em torno de x (k → −k); leitura (+N Δk, kₓ de −N/2 a +N/2) com o eco no centro. G_pe desce um passo por TR (de +(N−1)/2 a −(N−1)/2) e o 180° inverte o sinal: o espaço k enche de baixo para cima.","Pré-fasar antes do 180° roda em paralelo com a codificação de fase (TE mínimo menor) e deixa o FID de um 180° imperfeito coerente só na borda da janela; um lobo depois do 180° o refocalizaria sobre o eco.","Spoiler: num scanner, um gradiente forte ao fim do TR desfasa a magnetização transversal que sobrou do decaimento T2, para que o 90° seguinte não a leve ao eixo z, onde o 180° seguinte a refocalizaria como eco estimulado espúrio. A caixa idealiza isso como M⊥ → 0. Com os tecidos reais e TR = 2000 ms o resíduo é desprezível e desmarcar não muda nada visível; o efeito aparece com T1/T2 globais, T2 = ∞ ou TR ≲ 2·T2.","A partir do 2º TR a magnetização longitudinal disponível é a recuperada, não M₀; é a origem do pequeno resíduo da reconstrução junto com o decaimento T2 ao longo da janela de leitura."],"en":["Sequence: 90° about y; readout prephaser (+N/2 Δk) and phase encoding simultaneous, before the 180°; 180° about x (k → −k); readout (+N Δk, kₓ from −N/2 to +N/2) with the echo at the center. G_pe steps down one unit per TR (from +(N−1)/2 to −(N−1)/2) and the 180° flips the sign: k-space fills bottom-up.","Prephasing before the 180° runs in parallel with phase encoding (shorter minimum TE) and leaves the FID of an imperfect 180° coherent only at the edge of the window; a lobe after the 180° would refocus it onto the echo.","Spoiler: in a scanner, a strong gradient at the end of the TR dephases the transverse magnetization left after T2 decay, so the next 90° does not carry it to the z axis, where the following 180° would refocus it as a spurious stimulated echo. The box idealizes this as M⊥ → 0. With real tissues and TR = 2000 ms the leftover is negligible and unchecking changes nothing visible; the effect shows with global T1/T2, T2 = ∞ or TR ≲ 2·T2.","From the 2nd TR on the available longitudinal magnetization is the recovered one, not M₀; together with T2 decay across the readout window it is the origin of the small reconstruction residual."]}},{"id":"fse","format":"didactic-mri-sequence/1","name":{"pt":"Fast Spin Echo","en":"Fast Spin Echo"},"subtitle":{"pt":"um trem de ecos, uma linha de k por eco","en":"an echo train, one k line per echo"},"lead":{"pt":"Um 90° e N pulsos de 180° (CPMG); cada eco adquire uma linha k_y, as N linhas numa única excitação. Matriz N×N no plano xy, um isocromato por pixel, referencial girante. Arraste sobre o diagrama para percorrer o tempo.","en":"One 90° and N 180° pulses (CPMG); each echo acquires one k_y line, all N lines from a single excitation. N×N array in the xy plane, one isochromat per pixel, rotating frame. Drag across the diagram to scrub through time."},"relax":{"T1":500,"T2":80},"phantom":"squareAir","envelope":true,"params":[{"id":"ESP","label":"ESP","min":26,"max":60,"step":2,"default":26,"unit":"ms","title":{"pt":"espaçamento entre ecos","en":"echo spacing"}},{"id":"order","type":"select","default":"linear","label":{"pt":"ordem de k_y","en":"k_y order"},"options":[{"value":"linear","label":{"pt":"linear (−(N−1)/2…+(N−1)/2)","en":"linear (−(N−1)/2…+(N−1)/2)"},"values":{"pe":"range(-HALF, HALF, 1)"}},{"value":"centric","label":{"pt":"centro primeiro","en":"center first"},"values":{"pe":"centric(HALF)"}},{"value":"centerLast","label":{"pt":"centro por último","en":"center last"},"values":{"pe":"rev(centric(HALF))"}}]}],"constants":{"w":5,"tLead":2,"tauPre":6,"tauPe":4,"tauRo":12,"tTail":30},"shots":1,"vars":{"Apre":"N/2","NECHO":"N","t90":"tLead + w/2","tActive":"t90 + NECHO*ESP + tauRo/2 + tauPe","iTE":"indexOf(pe, 0)","TEeff":"(iTE + 1)*ESP"},"TR":"tActive + tTail","events":[{"type":"rf","t":"tLead","dur":"w","flip":90,"axis":"y","desc":{"pt":"pulso de 90° (rotação em torno de y)","en":"90° pulse (rotation about y)"}},{"type":"grad","axis":"x","t":"tLead + w","dur":"tauPre","area":"Apre","desc":{"pt":"pré-fase de leitura (Gfe): kₓ vai a +${N/2}","en":"readout prephaser (Gfe): kₓ goes to +${N/2}"}},{"type":"repeat","count":"NECHO","var":"i","vars":{"t180":"t90 + ESP/2 + i*ESP","tEcho":"t90 + (i + 1)*ESP","step":"pe[i]","roStart":"tEcho - tauRo/2"},"events":[{"type":"band","t":"t180","label":{"pt":"eco ${i+1} · k_y = ${+step}","en":"echo ${i+1} · k_y = ${+step}"}},{"type":"rf","t":"t180 - w/2","dur":"w","flip":180,"axis":"x","refocus":true,"desc":{"pt":"pulso de 180° (rotação em torno de x): fases invertidas, k → −k; kₓ = ${-N/2}","en":"180° pulse (rotation about x): phases reversed, k → −k; kₓ = ${-N/2}"}},{"type":"grad","axis":"y","t":"roStart - tauPe","dur":"tauPe","area":"step","label":"${+step}","desc":{"pt":"codificação de fase (Gpe): k_y vai a ${+step}","en":"phase encoding (Gpe): k_y goes to ${+step}"}},{"type":"grad","axis":"x","t":"roStart","dur":"tauRo","area":"N","desc":{"pt":"leitura: Gfe varre kₓ de ${-N/2} a +${N/2}","en":"readout: Gfe sweeps kₓ from ${-N/2} to +${N/2}"}},{"type":"adc","t":"roStart","dur":"tauRo","n":"N","desc":{"pt":"amostras em kₓ = ${-HALF}…+${HALF}","en":"samples at kₓ = ${-HALF}…+${HALF}"}},{"type":"grad","axis":"y","t":"roStart + tauRo","dur":"tauPe","area":"-step","desc":{"pt":"rebobinador de Gpe: k_y volta a 0 antes do próximo 180°","en":"Gpe rewinder: k_y back to 0 before the next 180°"}}]},{"type":"arrow","t":"t90 + ESP/2","to":"t90 + 3*ESP/2","label":"ESP","sub":{"pt":"espaçamento entre ecos","en":"echo spacing"},"style":"esp","level":0},{"type":"arrow","t":"t90","to":"t90 + TEeff","label":"T_{E,ef}","style":"te","level":1},{"type":"mark","t":"t90","style":"te","level":1},{"type":"mark","t":"t90 + TEeff","style":"te","level":1},{"type":"mark","t":"t90 + ESP/2","style":"esp"},{"type":"mark","t":"t90 + 3*ESP/2","style":"esp"}],"notes":{"pt":["Sequência: 90° em torno de y, pré-fasador de leitura (+N/2 Δk) antes do primeiro 180°, depois um trem de N pulsos de 180° em torno de x (condição CPMG: o eixo do pulso de refocalização coincide com a magnetização excitada), espaçamento ESP. Cada eco adquire uma linha k_y: passo de Gpe logo antes da leitura, leitura (+N Δk), rebobinador (−passo) que devolve k_y a 0 antes do próximo 180°. As leituras se equilibram sozinhas através dos 180°: kₓ = +N/2 ao fim de uma leitura vira −N/2 no pulso seguinte.","A linha tracejada no sinal é a envoltória e^{−t/T2} do máximo possível (|S| ≤ ΣM₀); só o eco com k_y = 0 a toca, os outros são componentes de Fourier menores.","Cada linha é adquirida com um TE diferente, logo com peso e^{−TE_n/T2} diferente: o decaimento vira um filtro W(k_y) multiplicando o espaço k, e a imagem reconstruída é a convolução do objeto com a transformada do filtro. A ordem de k_y decide qual eco cai em k_y = 0 (TE efetivo, a seta verde): linear → ESP·(N+1)/2, centro primeiro → ESP (filtro passa-baixa, borramento em y), centro por último → N·ESP (realce de bordas e ringing). A Fourier reversa mostra cada modo com a amplitude que o T2 deixou.","Com 180° exatos, k → −k em cada pulso marca a trajetória. Outros ângulos de refocalização não são expostos: com um isocromato por pixel, caminhos de coerência desfasados por múltiplos de N Δk se repetem exatamente (aliasing da grade de N pontos) e seriam mostrados como refocalizados."],"en":["Sequence: 90° about y, readout prephaser (+N/2 Δk) before the first 180°, then a train of N 180° pulses about x (CPMG: the refocusing axis coincides with the excited magnetization), echo spacing ESP. Each echo acquires one k_y line: Gpe step right before the readout, readout (+N Δk), rewinder (−step) returning k_y to 0 before the next 180°. The readouts balance themselves across the 180°s: kₓ = +N/2 at the end of a readout becomes −N/2 at the next pulse.","The dashed line in the signal row is the envelope e^{−t/T2} of the largest possible signal (|S| ≤ ΣM₀); only the echo with k_y = 0 touches it, the others are smaller Fourier components.","Each line is acquired at a different TE, hence with a different weight e^{−TE_n/T2}: the decay becomes a filter W(k_y) multiplying k-space, and the reconstructed image is the object convolved with the filter's transform. The k_y order decides which echo lands on k_y = 0 (effective TE, the green arrow): linear → ESP·(N+1)/2, center first → ESP (low-pass filter, blurring along y), center last → N·ESP (edge enhancement and ringing). The inverse Fourier shows each mode with the amplitude T2 left it.","With exact 180°s, k → −k at every pulse marks the trajectory. Other refocusing angles are not exposed: with one isochromat per pixel, coherence pathways dephased by multiples of N Δk repeat exactly (aliasing of the N-point grid) and would be shown as refocused."]}},{"id":"flair","format":"didactic-mri-sequence/1","name":{"pt":"FLAIR","en":"FLAIR"},"subtitle":{"pt":"inversão–recuperação com leitura fast spin echo; TI escolhido para anular o líquor","en":"inversion recovery with a fast spin-echo readout; TI chosen to null CSF"},"lead":{"pt":"Um 180° de inversão, espera TI, depois o fast spin echo (90° + N pulsos de 180°, uma linha k_y por eco). Com TI = T1·ln 2 de um tecido, esse tecido tem M_z = 0 no 90° e não dá sinal. Use o objeto \"cérebro\" (tecidos com T1 e T2 próprios); com os outros objetos T1 e T2 vêm dos cursores e o TI anula a imagem inteira.","en":"A 180° inversion, a wait TI, then the fast spin echo (90° + N 180° pulses, one k_y line per echo). With TI = T1·ln 2 of a tissue, that tissue has M_z = 0 at the 90° and gives no signal. Use the \"brain\" phantom (tissues with their own T1 and T2); with the other phantoms T1 and T2 come from the sliders and TI nulls the whole image."},"relax":{"T1":850,"T2":80},"phantom":"brain","envelope":false,"params":[{"id":"TI","label":"TI","min":50,"max":3500,"step":50,"default":2800,"unit":"ms","title":{"pt":"tempo de inversão (centro do 180° de inversão ao centro do 90°)","en":"inversion time (center of the inversion 180° to center of the 90°)"}},{"id":"ESP","label":"ESP","min":10,"max":60,"step":2,"default":10,"unit":"ms","title":{"pt":"espaçamento entre ecos","en":"echo spacing"}},{"id":"order","type":"select","default":"linear","label":{"pt":"ordem de k_y","en":"k_y order"},"options":[{"value":"linear","label":{"pt":"linear (−(N−1)/2…+(N−1)/2)","en":"linear (−(N−1)/2…+(N−1)/2)"},"values":{"pe":"range(-HALF, HALF, 1)"}},{"value":"centric","label":{"pt":"centro primeiro","en":"center first"},"values":{"pe":"centric(HALF)"}},{"value":"centerLast","label":{"pt":"centro por último","en":"center last"},"values":{"pe":"rev(centric(HALF))"}}]}],"constants":{"w":2,"tLead":2,"tauPre":3,"tauPe":2,"tauRo":4,"tTail":300},"shots":1,"vars":{"Apre":"N/2","NECHO":"N","tInv":"tLead + w/2","t90":"tInv + TI","tActive":"t90 + NECHO*ESP + tauRo/2 + tauPe","iTE":"indexOf(pe, 0)","TEeff":"(iTE + 1)*ESP"},"TR":"tActive + tTail","events":[{"type":"rf","t":"tLead","dur":"w","flip":180,"axis":"x","desc":{"pt":"180° de inversão: M_z → −M_z em todos os pixels","en":"inversion 180°: M_z → −M_z in every pixel"}},{"type":"rf","t":"t90 - w/2","dur":"w","flip":90,"axis":"y","desc":{"pt":"pulso de 90°: o M_z recuperado durante TI vai para o plano; quem tem M_z = 0 não dá sinal","en":"90° pulse: the M_z recovered during TI goes to the plane; whoever has M_z = 0 gives no signal"}},{"type":"grad","axis":"x","t":"t90 + w/2","dur":"tauPre","area":"Apre","desc":{"pt":"pré-fase de leitura (Gfe): kₓ vai a +${N/2}","en":"readout prephaser (Gfe): kₓ goes to +${N/2}"}},{"type":"repeat","count":"NECHO","var":"i","vars":{"t180":"t90 + ESP/2 + i*ESP","tEcho":"t90 + (i + 1)*ESP","step":"pe[i]","roStart":"tEcho - tauRo/2"},"events":[{"type":"band","t":"t180","label":{"pt":"eco ${i+1} · k_y = ${+step}","en":"echo ${i+1} · k_y = ${+step}"}},{"type":"rf","t":"t180 - w/2","dur":"w","flip":180,"axis":"x","refocus":true,"desc":{"pt":"pulso de 180° (rotação em torno de x): fases invertidas, k → −k; kₓ = ${-N/2}","en":"180° pulse (rotation about x): phases reversed, k → −k; kₓ = ${-N/2}"}},{"type":"grad","axis":"y","t":"roStart - tauPe","dur":"tauPe","area":"step","label":"${+step}","desc":{"pt":"codificação de fase (Gpe): k_y vai a ${+step}","en":"phase encoding (Gpe): k_y goes to ${+step}"}},{"type":"grad","axis":"x","t":"roStart","dur":"tauRo","area":"N","desc":{"pt":"leitura: Gfe varre kₓ de ${-N/2} a +${N/2}","en":"readout: Gfe sweeps kₓ from ${-N/2} to +${N/2}"}},{"type":"adc","t":"roStart","dur":"tauRo","n":"N","desc":{"pt":"amostras em kₓ = ${-HALF}…+${HALF}","en":"samples at kₓ = ${-HALF}…+${HALF}"}},{"type":"grad","axis":"y","t":"roStart + tauRo","dur":"tauPe","area":"-step","desc":{"pt":"rebobinador de Gpe: k_y volta a 0 antes do próximo 180°","en":"Gpe rewinder: k_y back to 0 before the next 180°"}}]},{"type":"band","t":"tInv","label":{"pt":"inversão · TI = ${TI} ms","en":"inversion · TI = ${TI} ms"}},{"type":"arrow","t":"tInv","to":"t90","label":"T_I","style":"tr","level":1},{"type":"arrow","t":"t90","to":"t90 + TEeff","label":"T_{E,ef}","style":"te","level":0},{"type":"mark","t":"tInv","style":"tr","level":1},{"type":"mark","t":"t90","style":"tr","level":1}],"notes":{"pt":["Sequência: 180° de inversão (em torno de x; M⊥ é zero em repouso, só M_z é invertido), espera TI, e então o fast spin echo: 90°, pré-fasador, N pulsos de 180° com uma linha k_y por eco. Recuperação durante TI: M_z(TI) = M₀(1 − 2e^{−TI/T1}); zera em TI = T1·ln 2. Para o líquor (T1 ≈ 4000 ms) isso dá TI ≈ 2770 ms; substância branca (850 ms) e cinzenta (1300 ms) já recuperaram boa parte de M₀ e dão sinal. É o FLAIR: imagem ponderada em T2 com o líquor escuro, onde lesões periventriculares deixam de se esconder atrás do líquor brilhante.","Em TI menor que T1·ln 2 de um tecido, seu M_z no 90° é negativo: o sinal nasce com fase π (ciano no espaço k, e vetores apontando para −x nas esferas). A imagem é mostrada em módulo, como no scanner, então esse tecido aparece claro, não escuro: só o tecido com M_z = 0 some.","O intervalo TI (milhares de ms) aparece comprimido no diagrama, como as caudas de TR: o tracejado marca o trecho fora de escala. Desmarque \"comprimir TR\" para ver em escala.","Borramento do trem de ecos: cada eco perde e^{−ESP/T2} (12% para a substância branca com ESP = 10 ms; 28% com 26 ms); com N linhas o filtro em k_y tem largura ≈ N·ESP/(π·T2) pixels (≈ 0,4 pixel com N = 9 e ESP = 10 ms; ≈ 0,9 com ESP = 26 ms). Com a ordem \"centro primeiro\" o filtro é passa-baixa e o líquor nulo reaparece cinza por borramento das vizinhanças; a ordem linear (padrão aqui) preserva muito melhor o módulo. Num scanner com 256 linhas o mesmo ESP/T2 borra uma fração de pixel. Valores padrão: ESP = 10 ms, TI = 2800 ms, ordem linear. Com eles o líquor some quase por completo (relação líquor/substância cinzenta no módulo da imagem, cérebro: 0,005 com N = 5; 0,004 com N = 9; 0,04 com N = 15); com ESP = 26 ms e o mesmo TI seriam 0,10 (N = 9) e 0,32 (N = 15). TI = 2800 ms fica um pouco acima de T1·ln 2 do líquor (2773 ms): foi escolhido por varredura, e para N ≥ 11 o melhor é 2850 ms. Valores empíricos, não derivados.","Objetos: com \"cérebro\", cada pixel tem (M₀, T1, T2) do seu tecido; com \"T1/T2 globais\" marcado, TI = T1·ln 2 anula a imagem inteira."],"en":["Sequence: inversion 180° (about x; M⊥ is zero at rest, only M_z is inverted), a wait TI, then the fast spin echo: 90°, prephaser, N 180° pulses with one k_y line per echo. Recovery during TI: M_z(TI) = M₀(1 − 2e^{−TI/T1}); it crosses zero at TI = T1·ln 2. For CSF (T1 ≈ 4000 ms) that is TI ≈ 2770 ms; white (850 ms) and gray matter (1300 ms) have recovered most of M₀ and give signal. That is FLAIR: a T2-weighted image with dark CSF, where periventricular lesions stop hiding behind bright CSF.","At TI below a tissue's T1·ln 2, its M_z at the 90° is negative: the signal is born with phase π (cyan in k-space, vectors pointing to −x in the spheres). The image is shown as a magnitude, as on the scanner, so that tissue appears bright, not dark: only the tissue with M_z = 0 vanishes.","The TI interval (thousands of ms) is compressed in the diagram, like the TR tails: the dashed stretch is off scale. Uncheck \"compress TR\" to see it to scale.","Echo-train blurring: each echo loses e^{−ESP/T2} (12% for white matter with ESP = 10 ms; 28% with 26 ms); with N lines the k_y filter has a width ≈ N·ESP/(π·T2) pixels (≈ 0.4 pixel at N = 9 and ESP = 10 ms; ≈ 0.9 with ESP = 26 ms). With \"center first\" the filter is low-pass and the nulled CSF reappears gray by blurring from its neighbors; linear order (the default here) preserves the magnitude far better. A 256-line scanner image with the same ESP/T2 blurs by a fraction of a pixel. Default values: ESP = 10 ms, TI = 2800 ms, linear order. With them the CSF all but vanishes (CSF/gray-matter ratio in the magnitude image, brain: 0.005 at N = 5; 0.004 at N = 9; 0.04 at N = 15); with ESP = 26 ms and the same TI it would be 0.10 (N = 9) and 0.32 (N = 15). TI = 2800 ms sits a little above the CSF value of T1·ln 2 (2773 ms): it was chosen by a sweep, and for N ≥ 11 the best is 2850 ms. Empirical values, not derived.","Phantoms: with \"brain\", each pixel has the (M₀, T1, T2) of its tissue; with \"global T1/T2\" checked, TI = T1·ln 2 nulls the whole image."]}}];</script>
<script>
(function () {

const $ = id => document.getElementById(id);
const I18N = {

    modeDensity: 'intensidade', modePhase: 'intensidade + fase', modeTissue: 'tecido', relaxOverride: 'T1/T2 globais (ignorar tecidos)', tissueHdr: 'tecido: PD · T1 · T2 (ms, 3 T)', linear: 'intensidade linear (sem √)', compress: 'comprimir TR', loadseq: 'carregar sequência (.json)', copyseq: 'copiar JSON da sequência', lang: 'EN', copy: 'copiar SVG do diagrama', copied: 'copiado ✓', copyFail: 'falhou — selecione e copie',
    tSpins: n => `Matriz ${n}×${n} de pixels (referencial girante)`, sSpinsDensity: 'escala de cinza = densidade de prótons M₀ · vermelho: M · azul: M∥ (z) e M⊥ (xy)', sSpinsTissue: 'cor = tecido (T1, T2 e M₀ próprios) · vermelho: M · azul: M∥ (z) e M⊥ (xy)', sSpinsPhase: 'cor = fase de M⊥ · intensidade = |M⊥| · vermelho: M · azul: M∥ (z) e M⊥ (xy)',
    tK: 'Espaço k (kₓ, k_y)', peDesc: 'codificação por fase', feDesc: 'codificação por frequência', envDesc: 'e<tspan dy="-5" font-size="8">−t/T2</tspan>',
    fplay: '▶ Fourier reversa', fpause: '❚❚ Pausar', freset: '⟲ Início', fprev: '◀ modo', fnext: 'modo ▶', fspeed: 'velocidade', fspeedUnit: 'modos/s',
    tImg: 'Imagem', tMode: 'Modo', tResid: 'Resíduo',
    sImgIdle: '|Σ dos modos adicionados| (imagem em módulo, como no scanner) · branco = máximo da reconstrução completa',
    sImg: (s, n, nm, np) => `|Σ de ${s}/${nm} modos| (módulo) · ${n}/${np} amostras · branco = máximo da reconstrução completa`,

$('linear').addEventListener('change', e => { st.linear = e.target.checked; applyLang(); render(); });
$('play').addEventListener('click', () => st.playing ? pause() : play());
$('reset').addEventListener('click', () => { pause(); st.u = 0; render(); });
$('prev').addEventListener('click', () => stepEvent(-1)); $('next').addEventListener('click', () => stepEvent(1));
$('lang').addEventListener('click', () => { st.lang = st.lang === 'pt' ? 'en' : 'pt'; applyLang(); rebuild(); });
function registerSequence(def) {
  if (!def || typeof def !== 'object' || !def.id || !Array.isArray(def.events)) throw new Error('not a sequence file');
  E.compile(def, E.paramDefaults(def), st.lang, st.N);        // validate with defaults
  if (!st.defs[def.id]) { const o = document.createElement('option'); o.value = def.id; $('seqSel').appendChild(o); st.order.push(def.id); }
  st.defs[def.id] = def;
}
$('loadseq').addEventListener('click', () => $('seqfile').click());
$('seqfile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try { const def = JSON.parse(rd.result); registerSequence(def); selectSequence(def.id); $('err').textContent = L().loaded + loc(def.name); } catch (ex) { $('err').textContent = L().errSeq + ex.message; } };
  rd.readAsText(file); e.target.value = '';
});
$('copyseq').addEventListener('click', () => {
  const btn = $('copyseq'), txt = JSON.stringify(st.def, null, 2);
  const done = ok => { btn.textContent = ok ? L().copied2 : L().copyFail; setTimeout(() => { btn.textContent = L().copyseq; }, 1800); };
  try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (ex) { done(false); }
});
$('copysvg').addEventListener('click', () => {
  const d = L(), svg = D.build(st.S, st.sim, drawOpts({ revealAll: true })).svg, btn = $('copysvg');
  const done = ok => { btn.textContent = ok ? d.copied : d.copyFail; setTimeout(() => { btn.textContent = L().copy; }, 1800); };
  try { navigator.clipboard.writeText(svg).then(() => done(true), () => done(false)); } catch (e) { done(false); }
});
document.addEventListener('keydown', e => {
  const tag = e.target.tagName, typ = e.target.type;
  if (tag === 'SELECT' || tag === 'BUTTON' && e.code === 'Space') return;
  if (tag === 'INPUT' && !(typ === 'checkbox' && e.code !== 'Space')) return;   // sliders/radios keep their keys; checkboxes keep Space
  if (e.code === 'Space') { e.preventDefault(); st.playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepEvent(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); stepEvent(-1); }
  else if (e.key === 'Home') { e.preventDefault(); pause(); st.u = 0; render(); }
});
const ro = new ResizeObserver(() => { if (st.sim) render(); }); ro.observe($('spins')); ro.observe($('kspace')); ro.observe($('img')); ro.observe($('mode'));
const mq = window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener('change', () => { refreshTheme(); renderWheel(); render(); });
new MutationObserver(() => { refreshTheme(); renderWheel(); render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

for (const def of PHANTOMS) registerPhantom(def);
for (const def of SEQUENCES) registerSequence(def);
refreshTheme(); selectSequence('se'); renderWheel();
})();
</script>

</body></html>
